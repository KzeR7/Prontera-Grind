# Prontera Grind — Cloudflare configuration
#
# Static client: `bash tools/build_site.sh` -> dist/  (see tools/server-shift-plan.md §7b)
# Server:        functions/  (Pages Functions: /api/* only — see _routes.json in the build)
#
# Deploy (Pages, connected to this GitHub repo):
#   Build command          bash tools/build_site.sh
#   Build output directory dist
#   Then: wrangler d1 create pg        (once; pick the region nearest the players)
#         wrangler d1 execute pg --remote --file=migrations/0001_init.sql   (new DB only)
#         wrangler d1 execute pg --remote --file=migrations/0002_leaderboard.sql   (once per DB)
#
# Local development (the official Functions runtime; tools/dev_server.js is the offline one):
#   npx wrangler pages dev dist --d1 DB=<database_id>   # binds THIS id to DB, on 127.0.0.1:8787
#   npx wrangler d1 execute pg --local --file=migrations/0001_init.sql
#   npx wrangler d1 execute pg --local --file=migrations/0002_leaderboard.sql
#
# Step-by-step deploy, including where the database id goes: tools/cloudflare-deploy-steps.md
#
# NOTE: Cloudflare treats this Pages config as the source of truth. Top-level bindings are
# for production; the explicit preview section below has NO database or social bindings.
# This takes effect only after deployment; existing previews must be checked separately.
#
# Nothing in functions/ is a secret: the D1 binding is injected by Cloudflare, and there is no API
# key anywhere in this repo.

name = "horizonhaven"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"              # available to every function as env.DB
database_name = "pg"
database_id = "50a6448b-1f12-466c-a28a-10544bedf750"   # printed by `wrangler d1 create pg`

# Optional: a second GM-only path could be bound here later (Variables/secrets go in the dashboard,
# never in this file).
#
# The GM console's "Cloudflare usage today" card (functions/api/gm/usage.js) reads Cloudflare's own
# counters when the project has these two values, set in the dashboard (Settings -> Variables and
# Secrets) rather than here, because one of them is a secret:
#   CF_ACCOUNT_ID       the account id (a plain variable)
#   CF_ANALYTICS_TOKEN  an API token with Account Analytics: Read (a SECRET - never commit it)
#   CF_D1_ID            optional: scope the D1 numbers to the `pg` database alone
# Without them the card still works, reporting our own ledger instead of the metered numbers.
# Deployment steps: tools/cloudflare-deploy-steps.md §8.

# Cash Shop (haven-v215). Two SECRETS, set with `npx wrangler pages secret put <NAME>` or in the
# dashboard (Settings -> Variables and Secrets), never here:
#   STRIPE_SECRET_KEY      sk_test_... while rehearsing, sk_live_... when selling
#   STRIPE_WEBHOOK_SECRET  whsec_... from the webhook endpoint pointed at /api/shop/webhook
# Without the first the shop is browse-only; without the second the webhook answers 503 and the
# order poll delivers instead. Database: migrations/0005_shop.sql. Guide: docs/MONETIZATION-SETUP.md.

# THE WRITE PAUSE — ENABLED 2026-10-30. docs/RECOVERY.md § "The write pause" is the reference;
# docs/ENABLE-WRITE-PAUSE.md is the ordered owner runbook used to turn it on.
#
# Order of operations, because the switch ships CLOSED: `prontera-gate` is deployed and its
# GATE_TOKEN secret is set BEFORE this binding exists. Once this deployment goes live, every
# /api/* request is refused with 503 until an operator opens the switch:
#   node tools/recovery/write_gate.mjs open "OPEN WRITES"
#
# Removing this block (or rolling the Pages deployment back) removes the pause with it, because
# WRITE_GATE unset means "no pause exists" - that is the tested rollback.
#
# Do not split these two: the variable without the binding, or the binding without the variable,
# is a misconfiguration that fails closed on purpose (that is what "required" means).
[vars]
WRITE_GATE = "required"

# The switch itself: a separate Worker with no D1 binding, no route and workers_dev = false, so a
# D1 restore cannot roll back the flag that is meant to guard it.
[[durable_objects.bindings]]
name = "GATE"
class_name = "WriteGate"
script_name = "prontera-gate"

# Deploy workers/social first; Pages connects privately to its Durable Object.
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "Social"
script_name = "prontera-social"

# PR/branch Pages previews are static-only by default. Never bind production resources here.
# Account, cloud save, leaderboard and social APIs are unavailable without isolated bindings.
# Existing previews and their effective bindings must be reviewed separately.
[env.preview]
d1_databases = []
durable_objects = { bindings = [] }
