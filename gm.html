<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prontera Grind — GM console</title>
<!--
  The GM console. A client of functions/api/gm/*, and nothing more: every action is authorised on the
  server from the session cookie, so this page can be served publicly without being a door. Open it
  while signed in as a GM (the owner account is the first one registered).

  Design notes (tools/gm-panel-plan.md):
  * Ragnarok atcommand vocabulary (@item, @zeny, @baselevel, @broadcast, @who, @ban) names the actions.
  * A password can be RESET here, never read: only hashes are stored, by design.
  * Every action writes an audit row; the Log tab shows them.
  * Grants are queued and applied by the player's own client on its next login (offline players are
    the normal case), which is why "sent" and "claimed" are two different columns.
-->
<style>
:root{--bg:#17120c;--card:#221a12;--edge:#4a3a26;--edge2:#6b5433;--ink:#f2e6cf;--dim:#b9a486;--gold:#e9d39a;--good:#2a9d3f;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
h1{font-size:16px;margin:0}
.badge{font-size:11px;background:var(--gold);color:#221a12;padding:2px 7px;border-radius:4px;font-weight:700}
.spacer{flex:1}
button{background:#2e2418;color:var(--ink);border:1px solid var(--edge2);border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer}
button:hover{background:#3a2d1d}
button.primary{background:var(--gold);color:#221a12;font-weight:700}
button.danger{border-color:var(--bad);color:#ffb3b5}
input,select,textarea{max-width:100%;background:#160f0a;color:var(--ink);border:1px solid var(--edge2);border-radius:4px;padding:5px 7px;font:12px inherit}
textarea{width:100%;min-height:60px;resize:vertical}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:12px;padding:12px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:10px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #33291c}
th{color:var(--dim);font-weight:600}
tr.sel{background:#33260f}
tr:hover{background:#2a2014;cursor:pointer}
.row>label{min-width:0;max-width:100%}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button.on{background:var(--gold);color:#221a12}
.small{font-size:11px;color:var(--dim)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.ok{color:#7ddc8a}.bad{color:#ff9d9f}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#2e2418;border:1px solid var(--edge2);
  border-radius:6px;padding:8px 14px;font-size:13px;display:none;z-index:9}
.hide{display:none!important}
.equipment-list{display:grid;gap:8px}.equipment-list article{border:1px solid var(--edge);padding:10px;border-radius:6px;overflow-wrap:anywhere}fieldset{min-width:0}#detail{min-width:0}details{margin:8px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#1d160e;border:1px solid var(--edge);border-radius:6px;padding:6px 8px}
.stat b{display:block;font-size:15px;color:var(--gold)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.meter{margin-top:6px}
.meter .top{display:flex;justify-content:space-between;font-size:11px}
.meter .track{height:6px;background:#160f0a;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:#2a9d3f}
.meter .fill.warn{background:#e9b949}
.meter .fill.bad{background:#e5484d}
</style>
</head>
<body>
<header>
  <h1>🛠️ Prontera Grind — GM console</h1>
  <span id="who" class="badge">checking…</span>
  <span class="spacer"></span>
  <button id="refresh">↻ Refresh</button>
  <button id="logout">Sign out</button>
  <button id="back" class="primary" onclick="location.href='/'">← Back to the game</button>
</header>

<main>
  <div class="col">
  <section class="card">
    <h2>Cloudflare usage today <span id="usagewhen" class="small"></span></h2>
    <div id="usagebody" class="small">Loading…</div>
  </section>

  <section class="card">
    <h2>Players <span id="count" class="small"></span></h2>
    <div class="row"><input id="search" placeholder="filter by name" style="flex:1"></div>
    <div style="max-height:60vh;overflow:auto"><table id="players"><thead>
      <tr><th>Name</th><th>Lv</th><th>Class</th><th>Last sync</th></tr>
    </thead><tbody></tbody></table></div>
    <p class="small">Click a player to open them. “never” means they have not synced a save yet.</p>
  </section>
  </div>

  <section id="detail" class="card hide"></section>
</main>

<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
let PLAYERS = [], SEL = null, TAB = 'character', CATALOG=null, playerRequest=0, giftRequest=null;
const say = (m, bad) => { const t = $('toast'); t.textContent = m; t.style.color = bad ? '#ff9d9f' : '#7ddc8a'; t.style.display = 'block'; clearTimeout(say._t); say._t = setTimeout(() => t.style.display = 'none', 4000); };
const api = async (path, opt) => {
  const r = await fetch('/api' + path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.err || ('HTTP ' + r.status));
  return d;
};
const when = t => t ? new Date(t).toLocaleString() : 'never';
const nfmt = n => (n == null ? '—' : Number(n).toLocaleString());
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- usage: what the game costs Cloudflare today ----------
// Static files are not metered at all; Function requests and D1 rows are, and the D1 ones hard-stop
// the day's writes when crossed. So this card puts the metered numbers against the free allowances,
// and always shows our own ledger (accounts, save bytes, history) next to them.
const bytes = n => n == null ? '—' : n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
  : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';

function meter(label, used, cap, hint) {
  if (used == null) return `<div class="meter"><div class="top"><span>${label}</span><span class="small">not measured here</span></div></div>`;
  const pct = cap ? Math.min(100, used / cap * 100) : 0;
  const cls = pct >= 80 ? 'bad' : pct >= 50 ? 'warn' : '';
  return `<div class="meter"><div class="top"><span>${label}</span><span class="small">${nfmt(used)} / ${nfmt(cap)} · ${pct.toFixed(1)}%${hint ? ' · ' + hint : ''}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div></div>`;
}

async function loadUsage() {
  let d = null;
  try { d = await api('/gm/usage'); } catch (e) { $('usagebody').innerHTML = `<span class="bad">Could not read usage: ${esc(e.message)}</span>`; return; }
  const L = d.ledger || {};
  $('usagewhen').textContent = '· ' + d.utcDay + ' UTC';
  $('usagebody').innerHTML = [
    meter('Function requests (all Workers on the account)', d.requests?.used, d.limits.requests, d.requests ? nfmt(d.requests.errors) + ' errors' : ''),
    meter('D1 rows written (the tight one)', d.d1?.rowsWritten, d.limits.rowsWritten, d.d1 && !d.d1.scoped ? 'all databases' : ''),
    meter('D1 rows read', d.d1?.rowsRead, d.limits.rowsRead, ''),
    `<div class="grid2" style="margin-top:8px">
      <div class="stat">accounts<b>${nfmt(L.accounts)}</b><span class="small">${nfmt(L.saves)} with a cloud save · ${nfmt(L.liveSessions)} live sessions</span></div>
      <div class="stat">save storage<b>${bytes(L.saveBytes)}</b><span class="small">biggest ${bytes(L.biggestSave)}</span></div>
      <div class="stat">save history<b>${bytes(L.historyBytes)}</b><span class="small">${nfmt(L.historyRows)} backup rows (5 per player)</span></div>
      <div class="stat">today<b>${nfmt(L.eventsToday)}</b><span class="small">logins &amp; GM actions · ${nfmt(L.grantsWaiting)} gifts waiting</span></div>
    </div>`,
    `<p class="small" style="margin:8px 0 0">${esc(d.note)}</p>`,
    d.error ? `<p class="small bad" style="margin:6px 0 0">Analytics: ${esc(d.error)}</p>` : '',
    d.hint ? `<p class="small" style="margin:6px 0 0">${esc(d.hint)}</p>` : '',
  ].join('');
}

async function loadPlayers() {
  const d = await api('/gm/players');
  PLAYERS = d.players;
  $('who').textContent = (d.me.gm >= 2 ? '👑 owner' : '🛠 GM') + ' · ' + d.me.u;
  $('count').textContent = '(' + PLAYERS.length + ')';
  renderPlayers();
}
function renderPlayers() {
  const q = $('search').value.trim().toLowerCase();
  const rows = PLAYERS.filter(p => !q || p.u.toLowerCase().includes(q));
  $('players').tBodies[0].innerHTML = rows.map(p =>
    `<tr data-id="${p.id}" class="${SEL && SEL.account.id === p.id ? 'sel' : ''}">
       <td>${p.banned ? '⛔ ' : ''}${p.gm ? (p.gm >= 2 ? '👑 ' : '🛠 ') : ''}${esc(p.u)}</td>
       <td>${p.level ?? '—'}</td><td>${esc(p.cls || '—')}</td><td>${when(p.lastSync)}</td>
     </tr>`).join('') || '<tr><td colspan="4" class="small">No players match.</td></tr>';
}
$('search').oninput = renderPlayers;
$('players').onclick = e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) openPlayer(+tr.dataset.id).catch(e=>say(e.message,1));
};
// Refresh reloads the usage card too: it is the screen the owner checks when they want to know what
// the game is costing, and a stale number there would be worse than the one extra request.
$('refresh').onclick = () => Promise.all([loadUsage(), SEL ? openPlayer(SEL.account.id) : loadPlayers()]).then(() => say('Refreshed.'));
$('logout').onclick = async () => { try { await api('/sessions', { method: 'DELETE', body: '{}' }); } catch (e) {} location.href = '/'; };

async function openPlayer(id) {
  const seq=++playerRequest;
  const d = await api('/gm/player?id=' + id);
  if(seq!==playerRequest)return;
  SEL = d;
  renderPlayers();
  renderDetail();
}

function renderDetail() {
  const d = SEL, a = d.account, s = d.save;
  const box = $('detail');
  box.classList.remove('hide');
  box.innerHTML = `
    <div class="row">
      <h2 style="margin:0">${a.banned ? '⛔ ' : ''}${a.gm ? (a.gm >= 2 ? '👑 ' : '🛠 ') : ''}${esc(a.u)}
        <span class="small">#${a.id} · created ${when(a.created)} · last login ${when(a.lastLogin)}</span></h2>
      <span class="spacer"></span>
      ${a.banned ? `<button data-act="unban">Unsuspend</button>` : `<button class="danger" data-act="ban">Suspend</button>`}
      <button data-act="logout">Force sign-out</button>
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="stat"><b>${s ? nfmt(s.pub.lv) : '—'}</b><span class="small">level${s && s.pub.cls ? ' · ' + esc(s.pub.cls) : ''}</span></div>
      <div class="stat"><b>${s ? nfmt(s.pub.zeny) : '—'}</b><span class="small">Zeny</span></div>
      <div class="stat"><b>${s ? nfmt(s.pub.playtime) : '—'}</b><span class="small">playtime (from their save)</span></div>
      <div class="stat"><b>${s ? s.version : 0}</b><span class="small">save version · ${s ? (s.bytes / 1024).toFixed(1) + ' KB' : 'no save yet'}</span></div>
      <div class="stat"><b>${s ? when(s.updatedAt) : 'never'}</b><span class="small">last sync (server clock)</span></div>
      <div class="stat"><b>${s ? nfmt(s.kills) : '—'}</b><span class="small">lifetime kills</span></div>
    </div>
    <div class="tabs">
      ${['character', 'equipment', 'account', 'send', 'announce', 'history', 'log'].map(t => `<button data-tab="${t}" class="${TAB === t ? 'on' : ''}">${({ character:'Full stats',equipment:'Equipment & affixes',account: 'Account', send: 'Send items & Zeny', announce: 'Announce', history: 'Backups', log: "This player's log" })[t]}</button>`).join('')}
    </div>
    <div id="tabbody"></div>`;
  renderTab();
}

function renderTab() {
  const d = SEL, a = d.account, s = d.save, body = $('tabbody');
  if(TAB==='character'){renderCharacter(body,s);
  }else if(TAB==='equipment'){renderEquipment(body,s);
  }else if (TAB === 'account') {
    body.innerHTML = `
      <div class="row"><button data-act="note">Add a note to the log</button></div>
      ${a.gm >= 2 ? `<p class="small">This account is the owner. GM level and password changes are owner-only.</p>` : ''}
      <fieldset style="border:1px solid var(--edge);border-radius:6px;padding:8px;margin-bottom:8px">
        <legend class="small">Password (owner only · never readable, only replaceable)</legend>
        <div class="row"><input id="newpw" type="password" placeholder="new password (min 10)" style="flex:1">
        <button data-act="set-password">Set password</button></div>
        <span class="small">Setting it signs them out everywhere. They can still use their recovery code.</span>
      </fieldset>
      <fieldset style="border:1px solid var(--edge);border-radius:6px;padding:8px">
        <legend class="small">GM level (owner only)</legend>
        <div class="row"><select id="gmlevel">
          <option value="0"${a.gm === 0 ? ' selected' : ''}>0 · normal player</option>
          <option value="1"${a.gm === 1 ? ' selected' : ''}>1 · GM (moderate, send, announce)</option>
          <option value="2"${a.gm === 2 ? ' selected' : ''}>2 · owner (also passwords and GM levels)</option>
        </select><button data-act="set-gm">Apply</button></div>
      </fieldset>`;
  } else if (TAB === 'send') {
    body.innerHTML = `<p class="small">Choose a gift and quantity. Offline players receive gifts when they return. A full bag leaves equipment gifts waiting.</p>
      <div class="row"><label>Recipients <select id="audience"><option value="player">${esc(a.u)}</option><option value="all">Whole server · all non-suspended accounts, including GMs</option></select></label></div>
      <div class="row"><label>Gift type <select id="kind"><option value="gift">Equipment, cards &amp; materials</option><option value="zeny">Zeny</option><option value="level">Base levels (one player)</option><option value="message">Message (one player)</option></select></label></div>
      <div id="kindbody"></div><div class="row"><label>Note <input id="note" placeholder="Reason for the gift"></label></div><button class="primary" data-act="grant">Review &amp; send gift</button>`;
    const paint=()=>{
      giftRequest=null;
      const k=$('kind').value;
      $('kindbody').innerHTML=k==='gift'?`<div class="row"><label>Search <input id="giftsearch" type="search" placeholder="Name, map, weapon type…"></label><label>Category <select id="giftcategory"><option value="">All</option><option value="gear">Equipment</option><option value="card">Cards</option><option value="resource">Materials &amp; currency</option></select></label></div><label>Item <select id="giftitem" style="width:100%"></select></label><p id="giftdetail" class="small"></p><label>Quantity <input id="amount" type="number" min="1" max="1000000" step="1" value="1"></label>`:
      k==='message'?'<label>Message <textarea id="text"></textarea></label>':`<label>Amount <input id="amount" type="number" step="1" value="${k==='zeny'?100000:1}"></label>`;
      if(k==='gift'){
        const detail=()=>{const entry=CATALOG.entries.find(x=>x.id===$('giftitem').value);$('giftdetail').innerHTML=entry?.item?gearDescription(entry.item):esc(entry?.label||'No matches');$('amount').max=entry?.resource?1000000:100;};
        const filter=()=>{const q=$('giftsearch').value.toLowerCase(),c=$('giftcategory').value;const rows=CATALOG.entries.filter(x=>(!c||x.type===c)&&x.label.toLowerCase().includes(q));$('giftitem').innerHTML=rows.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('');detail();};
        $('giftsearch').oninput=filter;$('giftcategory').onchange=filter;$('giftitem').onchange=detail;filter();
      }
    };
    $('kind').onchange=paint;paint();
  } else if (TAB === 'announce') {
    body.innerHTML = `
      <p class="small">A banner in every player's log. “Everyone” is stored once and read by all; “just this player” is private.</p>
      <textarea id="abody" placeholder="e.g. Server restarts at 22:00 tonight — save your progress."></textarea>
      <div class="row" style="margin-top:6px">
        <select id="akind"><option value="notice">Notice</option><option value="event">Event</option><option value="welcome">Welcome</option></select>
        <label class="small"><input type="checkbox" id="atoall"> to everyone</label>
        <button class="primary" data-act="announce">Send</button>
      </div>`;
  } else if (TAB === 'history') {
    body.innerHTML = s && s.history.length
      ? `<p class="small">Saved copies of this account. Restoring one makes it the live save (a new version on top) and keeps the current one as a backup, so a mistake is reversible.</p>
         <table><thead><tr><th>Version</th><th>Saved</th><th></th></tr></thead><tbody>
         ${s.history.map(h => `<tr><td>${h.version}</td><td>${when(h.savedAt)}</td><td><button data-act="restore" data-v="${h.version}">Restore</button></td></tr>`).join('')}
         </tbody></table>`
      : `<p class="small">No backups kept yet. A backup is written every 10th save version, so this fills in as they play.</p>`;
    body.innerHTML += `<h2 style="margin-top:12px">Sent to this player</h2>` + (d.grants.length
      ? `<table><thead><tr><th>#</th><th>Kind</th><th>When</th><th>State</th><th>Note</th></tr></thead><tbody>
         ${d.grants.map(g => `<tr><td>${g.id}</td><td>${esc(g.kind)}</td><td>${when(g.at)}</td><td>${g.claimed ? '✅ collected' : '⏳ waiting'}</td><td class="small">${esc(g.note || '')}</td></tr>`).join('')}</tbody></table>`
      : `<p class="small">Nothing sent yet.</p>`);
  } else {
    body.innerHTML = d.events.length
      ? `<table><thead><tr><th>When</th><th>Action</th><th>Detail</th><th>By</th></tr></thead><tbody>
         ${d.events.map(e => `<tr><td>${when(e.at)}</td><td>${esc(e.label || e.kind)}</td><td class="small">${esc(e.detail || '')}</td><td>${esc(e.actor || '')}</td></tr>`).join('')}
         </tbody></table>`
      : `<p class="small">Nothing logged for this player yet.</p>`;
  }
}

function statRows(o){return Object.entries(o||{}).map(([k,v])=>`<div class="stat">${esc(CATALOG.affixes[k]||CATALOG.skills[k]||k)}<b>${typeof v==='number'?nfmt(Math.round(v*100)/100):esc(v)}</b></div>`).join('')}
function gearDescription(it){
 if(!it)return '<span class="small">Empty</span>';
 const aff=(it.aff||[]).map(a=>esc(CATALOG.affixes[a.k]||a.k)+' +'+esc(a.v)).join(' · ');
 const effects=c=>(c.effects||[{k:c.stat,v:c.v}]).filter(e=>e.k).map(e=>esc(CATALOG.affixes[e.k]||e.k)+' +'+esc(e.v)).join(', ');
 if(it.card)return `<b>${esc(it.n||it.name)}</b> · ${effects(it)} · fits ${esc((it.fit||[]).join(', '))}`;
 return `<b>+${esc(it.r||0)} ${esc(it.name)}</b> · ${esc(it.wt||it.slot)}<br>Base ${esc(CATALOG.slotStats[it.slot]||'value')} ${nfmt(it.val)} → refined ${nfmt(Math.round(it.val*(1+(it.r||0)*.15)))} · ${esc(it.slots||0)} sockets · ${esc(CATALOG.sections[it.sec??0])} · ${esc(it.sec>=5?'N+':it.sec>=4?'N':CATALOG.rarities[it.tier??0])}<br>${aff||'No affixes'}${(it.cards||[]).map(c=>'<br>Card: '+esc(c.n||c.name)+' · '+effects(c)).join('')}`;
}
function renderCharacter(body,s){
 const c=s?.character;if(!c){body.innerHTML='<p>No cloud save yet.</p>';return;}
 const snap=c.stats;
 body.innerHTML=`<p class="small">Latest cloud save: ${when(s.updatedAt)}. Combat values are reported by the game and include buffs active at the snapshot time.</p><h2>Base stats</h2><div class="grid2">${statRows(c.st)}</div><h2 style="margin-top:12px">Total stats with equipment</h2>${snap?`<div class="grid2">${statRows(snap.total)}</div><h2 style="margin-top:12px">Combat · ${when(snap.at)}</h2><div class="grid2">${statRows(snap.combat)}</div>`:'<p>Combat snapshot not available yet. The player must save using the current game build.</p>'}<h2 style="margin-top:12px">Progression &amp; resources</h2><div class="grid2">${statRows({'Current HP':c.hp,'Base EXP':c.exp,'Unspent stat points':c.pts,'Echo Shards':c.shards,...c.ore})}</div><h2 style="margin-top:12px">Job levels</h2><div class="grid2">${statRows(Object.fromEntries(Object.entries(c.jobs||{}).map(([k,v])=>[k,v.jl])))}</div><details><summary>Learned skill ranks</summary><div class="grid2">${statRows(c.skills)}</div></details><h2>Equipped items</h2><div class="equipment-list">${CATALOG.slots.map(x=>`<article>${esc(x.label)}<br>${gearDescription(c.equipment[x.id])}</article>`).join('')}</div>`;
}
function equipmentSlots(it,c){
 const cls=CATALOG.classes[c.cls];if(!cls||Math.min(3,it.sec||0)>Math.max(1,cls.tier))return [];
 if(it.slot==='weapon'&&!cls.wt.includes(it.wt))return [];
 const shield=/^(Novice|Swordman|Knight|Lord Knight|Acolyte|Priest|High Priest|Merchant|Blacksmith|Whitesmith)$/.test(c.cls);
 return CATALOG.slots.filter(x=>x.id==='off'?(c.equipment.weapon?.wt!=='katar'&&(it.slot==='off'&&shield||it.wt==='dagger'&&cls.wt.includes('katar'))):x.id==='acc1'||x.id==='acc2'?it.slot==='acc':it.slot===x.id);
}
function renderEquipment(body,s){
 const c=s?.character;if(!c){body.innerHTML='<p>No cloud save yet.</p>';return;}
 const gear=[...Object.entries(c.equipment).filter(([,it])=>it).map(([slot,it])=>({it,where:'Equipped · '+slot})),...c.inventory.filter(it=>!it.card&&!it.ore).map(it=>({it,where:'Bag'}))];
 body.innerHTML=`<p class="small">Changes are queued for the next login or sync. Class and slot rules are checked again when applied. The previous equipped item returns to the bag.</p><label>Equipment <select id="edititem" style="width:100%">${gear.map((x,i)=>`<option value="${i}">${esc(x.where+' · +'+(x.it.r||0)+' '+x.it.name)}</option>`).join('')}</select></label><div id="editbody"></div>`;
 const paint=()=>{
  const x=gear[+$('edititem').value];if(!x){$('editbody').innerHTML='<p>No equipment owned.</p>';return;}
  const it=x.it,slots=equipmentSlots(it,c),pool=CATALOG.entries.find(x=>x.type==='gear'&&x.item.slot===it.slot&&x.item.wt===it.wt)?.affixes||[];
  $('editbody').innerHTML=`<p>${gearDescription(it)}</p><fieldset><legend>Affixes &amp; refinement</legend><label>Refine <input id="editrefine" type="number" min="0" max="10" step="1" value="${esc(it.r||0)}"></label>${[0,1,2].map(i=>`<div class="row"><label>Affix ${i+1} <select id="affkey${i}"><option value="">None</option>${pool.map(k=>`<option value="${k}" ${it.aff?.[i]?.k===k?'selected':''}>${esc(CATALOG.affixes[k]||CATALOG.skills[k]||k)}</option>`).join('')}</select></label><label>Value <input id="affval${i}" type="number" min="1" max="10000" step="0.1" value="${esc(it.aff?.[i]?.v||1)}"></label></div>`).join('')}<button data-act="equipment" data-mode="affixes" data-item="${esc(it.id)}">Review &amp; apply affixes</button></fieldset>${x.where==='Bag'&&slots.length?`<fieldset><legend>Equip this item</legend><label>Slot <select id="editslot">${slots.map(s=>`<option value="${s.id}">${esc(s.label)}</option>`).join('')}</select></label><button data-act="equipment" data-mode="equip" data-item="${esc(it.id)}">Review &amp; equip</button></fieldset>`:''}`;
 };
 $('edititem').onchange=paint;paint();
}

$('detail').addEventListener('click', async e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { TAB = tabBtn.dataset.tab; renderDetail(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn || !SEL) return;
  const act = btn.dataset.act, id = SEL.account.id;
  try {
    if (act === 'note') {
      const text = prompt('Note for the audit log:');
      if (!text) return;
      await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'note', text }) });
      say('Noted.');
    } else if (act === 'ban' || act === 'unban') {
      if (act === 'ban' && !confirm('Suspend ' + SEL.account.u + '? They will not be able to log in until you unsuspend.')) return;
      await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: act }) });
      say(act === 'ban' ? 'Suspended.' : 'Unsuspended.');
    } else if (act === 'logout') {
      await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'logout' }) });
      say('Signed out everywhere.');
    } else if (act === 'set-password') {
      const password = $('newpw').value;
      if (password.length < 10) return say('Use at least 10 characters.', 1);
      if (!confirm('Set a new password for ' + SEL.account.u + '? Every device they are signed in on will be signed out.')) return;
      const r = await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'set-password', password }) });
      say(r.note || 'Password set.');
      $('newpw').value = '';
    } else if (act === 'set-gm') {
      const level = +$('gmlevel').value;
      await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'set-gm', level }) });
      say('GM level set to ' + level + '.');
    } else if (act === 'grant') {
      const kind=$('kind').value,all=$('audience').value==='all',amount=+$('amount')?.value,note=$('note').value;
      if(all&&!['gift','zeny'].includes(kind))return say('Whole-server gifts support items, materials and positive Zeny.',1);
      const entry=kind==='gift'?CATALOG.entries.find(x=>x.id===$('giftitem').value):null;
      if(kind==='gift'&&!entry)return say('Select an item.',1);
      if(kind!=='message'&&(!Number.isInteger(amount)||amount===0||kind==='gift'&&(amount<1||amount>(entry.resource?1000000:100))))return say('Enter a valid whole-number quantity.',1);
      const label=entry?.label||kind;
      if(!confirm('Send '+(kind==='message'?'message':amount+' × '+label)+' to '+(all?'ALL non-suspended accounts (including offline players and GMs)':SEL.account.u)+'?'))return;
      const body={id,action:kind==='gift'?'gift':'grant',kind,catalogId:entry?.id,amount,note,payload:kind==='message'?{text:$('text').value}:{amount}};
      if(all){const signature=JSON.stringify(body);if(!giftRequest||giftRequest.signature!==signature)giftRequest={signature,id:crypto.randomUUID()};body.requestId=giftRequest.id;}
      btn.disabled=true;
      try{const r=await api(all?'/gm/gifts':'/gm/player',{method:'POST',body:JSON.stringify(body)});giftRequest=null;say(r.note||'Sent.');}finally{btn.disabled=false;}
    } else if(act==='equipment'){
      const mode=btn.dataset.mode,aff=[0,1,2].map(i=>({k:$('affkey'+i).value,v:+$('affval'+i).value})).filter(x=>x.k);
      if(!confirm('Queue this equipment change for '+SEL.account.u+'? It applies when their game syncs.'))return;
      btn.disabled=true;
      try{const r=await api('/gm/player',{method:'POST',body:JSON.stringify({id,action:'equipment',mode,itemId:btn.dataset.item,slot:$('editslot')?.value,aff,refine:+$('editrefine').value})});say(r.note);}finally{btn.disabled=false;}
    } else if (act === 'announce') {
      const body = $('abody').value, toAll = $('atoall').checked, kind = $('akind').value;
      if (!body.trim()) return say('Write something first.', 1);
      await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'announce', body, kind, toAll }) });
      say(toAll ? 'Announced to everyone.' : 'Sent to ' + SEL.account.u + '.');
    } else if (act === 'restore') {
      const v = +btn.dataset.v;
      if (!confirm('Restore version ' + v + ' as their live save? The current save is kept as a backup.')) return;
      const r = await api('/gm/player', { method: 'POST', body: JSON.stringify({ id, action: 'restore', version: v }) });
      say('Restored as version ' + r.version + '.');
    }
    await openPlayer(id);
  } catch (err) { say(err.message, 1); }
});

// Sign-in check: this page is public, but every call it makes is authorised on the server.
(async () => {
  try {
    const me = await api('/me');
    if (!me.gm) { document.body.innerHTML = '<main><section class="card"><h2>Not a GM</h2><p>Sign in with the owner account in the game first, then come back. <a href="/" style="color:var(--gold)">Back to the game</a></p></section></main>'; return; }
    CATALOG=await api('/gm/catalog');
    await loadUsage();          // both cards in parallel: the usage call is the slow one (Cloudflare API)
    await loadPlayers();
  } catch (e) {
    document.body.innerHTML = '<main><section class="card"><h2>Sign in first</h2><p>This console works from the session you already have in the game. <a href="/" style="color:var(--gold)">Open the game and sign in</a>, then return here.</p></section></main>';
  }
})();
</script>
