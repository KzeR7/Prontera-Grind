<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain v2 — full proposal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{--bg:#0f1113;--panel:#171a1d;--line:#2a2f34;--ink:#e7e9ea;--dim:#9aa2a8;--accent:#8fd0a0;--warn:#e0b060}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 header{position:sticky;top:0;z-index:5;background:rgba(15,17,19,.94);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
 header .name{font-weight:600;letter-spacing:.02em}
 header a{color:var(--accent);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:4px 10px;border-radius:6px}
 header a:hover{background:var(--panel)}
 #status{margin-left:auto;color:var(--dim);font-size:12px}
 main{max-width:1080px;margin:0 auto;padding:28px 24px 96px}
 h1{font-size:30px;line-height:1.25;margin:.2em 0 .5em;border-bottom:2px solid var(--line);padding-bottom:.35em}
 h2{font-size:22px;margin:2.2em 0 .6em;padding-top:.4em;border-top:1px solid var(--line)}
 h3{font-size:17px;margin:1.8em 0 .5em;color:#cfd6db}
 h4{font-size:15px;margin:1.4em 0 .4em;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
 p{margin:.7em 0}
 ul,ol{margin:.7em 0;padding-left:1.5em}
 li{margin:.3em 0}
 code{background:#1e2328;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 pre{background:#14181b;border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow:auto}
 pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.55}
 table{border-collapse:collapse;margin:1em 0;font-size:13.5px;width:100%;display:block;overflow-x:auto}
 th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
 th{background:var(--panel);font-weight:600;white-space:nowrap}
 tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
 a{color:var(--accent)}
 hr{border:0;border-top:1px solid var(--line);margin:2em 0}
 blockquote{margin:1em 0;padding:.2em 0 .2em 16px;border-left:3px solid var(--warn);color:#cfd6db}
 img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:1em 0}
 figure{margin:1.6em 0}
 figcaption{color:var(--dim);font-size:12.5px;margin-top:.5em}
 .boards{display:grid;gap:20px;margin:1.4em 0}
 .boards figure{margin:0}
 strong{color:#fff}
 em{color:#d8dee2}
</style>
</head>
<body>
<header>
 <span class="name">Terrain v2 — full proposal</span>
 <a href="/tools/maps/terrain_v2_preview.html">Live landform viewer (all 10)</a>
 <a href="/game?nativeFields=1">In game</a>
 <a href="/docs/proposals/terrain-v2/board-color.png">Colour evidence</a>
 <a href="/docs/proposals/terrain-v2/board-floor-real.png">Floor evidence</a>
 <span id="status">loading…</span>
</header>
<main id="doc"></main>

<script id="renderer">
// Minimal markdown -> HTML. Deliberately small: the proposal is the single source of
// truth (docs/proposals/map-terrain-upgrade-2026-10-25.md) and this page only renders it,
// so the document and the viewer can never drift apart.
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
 return esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(])\*([^*]+)\*/g,'$1<em>$2</em>');
}
function render(md){
 const lines=md.replace(/\r/g,'').split('\n');
 const out=[];let i=0;
 // Split table cells without breaking on pipes inside `code spans`: the proposal quotes
 // expressions like `|x| > 32`, and a naive split tears those cells apart.
 const cell=s=>{
  const parts=[];let cur='',tick=false;
  for(let k=0;k<s.length;k++){
   const ch=s[k];
   if(ch==='`')tick=!tick;
   if(ch==='|'&&!tick){parts.push(cur);cur='';continue}
   cur+=ch;
  }
  parts.push(cur);
  return parts.slice(1,-1).map(c=>c.trim());
 };
 while(i<lines.length){
  const line=lines[i];
  if(/^```/.test(line)){                    // fenced code
   const buf=[];i++;
   while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);
   i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue;
  }
  if(/^\s*$/.test(line)){i++;continue}
  if(/^(-{3,}|\*{3,})$/.test(line.trim())){out.push('<hr>');i++;continue}
  let h=/^(#{1,6})\s+(.*)$/.exec(line);
  if(h){const n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>');i++;continue}
  if(/^>\s?/.test(line)){                   // blockquote
   const buf=[];
   while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));
   out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>');continue;
  }
  if(/^\|/.test(line)&&/^\|[\s:|-]+\|?\s*$/.test(lines[i+1]||'')){   // table
   const head=cell(lines[i]);i+=2;
   const rows=[];
   while(i<lines.length&&/^\|/.test(lines[i]))rows.push(cell(lines[i++]));
   out.push('<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
   continue;
  }
  if(/^\s*([-*+]|\d+\.)\s+/.test(line)){    // list
   const ordered=/^\s*\d+\./.test(line);
   const items=[];
   while(i<lines.length){
    const l=lines[i];
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){items.push(l.replace(/^\s*([-*+]|\d+\.)\s+/,''));i++}
    else if(/^\s{2,}\S/.test(l)&&items.length){items[items.length-1]+=' '+l.trim();i++}
    else break;
   }
   out.push('<'+(ordered?'ol':'ul')+'>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');
   continue;
  }
  const buf=[];                             // paragraph
  while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|```|>|\||\s*([-*+]|\d+\.)\s)/.test(lines[i]))buf.push(lines[i++]);
  out.push('<p>'+inline(buf.join(' '))+'</p>');
 }
 return out.join('\n');
}
if(typeof module!=='undefined')module.exports={render,inline,esc};
</script>

<script>
(async()=>{
 const status=document.getElementById('status'),doc=document.getElementById('doc');
 const src='/docs/proposals/map-terrain-upgrade-2026-10-25.md';
 try{
  const res=await fetch(src,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const md=await res.text();
  doc.innerHTML=render(md);
  // The boards belong under the section that argues about them, not buried in a list.
  const colourSection=[...doc.querySelectorAll('h2')].find(h=>/colour answer/i.test(h.textContent));
  if(colourSection){
   const fig=document.createElement('div');
   fig.className='boards';
   fig.innerHTML=
    '<figure><img src="/docs/proposals/terrain-v2/board-color.png" alt="raw vs graded field colours">'+
    '<figcaption>Raw native base tiles (top) vs the floor the game now ships (bottom), all ten fields, with RGB and HSV printed under each swatch.</figcaption></figure>'+
    '<figure><img src="/docs/proposals/terrain-v2/board-floor-real.png" alt="the ten shipped floors">'+
    '<figcaption>The ten floors exactly as <code>build()</code> produces them — not a mock-up: <code>render_floor_real.js</code> runs the shipping compositor against a real canvas.</figcaption></figure>';
   let n=colourSection.nextElementSibling;
   while(n&&!/^H2$/.test(n.tagName))n=n.nextElementSibling;
   if(n)doc.insertBefore(fig,n);else doc.appendChild(fig);
  }
  status.textContent=md.split('\n').length+' lines rendered';
 }catch(e){
  status.textContent='could not load the proposal: '+e.message;
  doc.innerHTML='<p style="color:#e0b060">Could not fetch <code>'+src+'</code> ('+e.message+
   '). Run <code>python3 tools/preview_server.py 8000</code> from the repo root and open this page from that server.</p>';
 }
})();
</script>
</body>
</html>
