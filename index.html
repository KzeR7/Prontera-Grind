<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontera Grind</title>
<style>
:root{--ink:#3b2a1a;--panel:#fff8e6;--edge:#c9a35b;--edge2:#8a6a2c;--hp:#e5484d;--exp:#4aa3df;--gold:#e8a800}
*{box-sizing:border-box}
body{margin:0;background:#2b3a55;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}
.win{background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--edge2),0 4px 0 2px var(--edge2)}
.title{font-weight:bold;background:linear-gradient(#f3d98b,#d9b25c);border-bottom:2px solid var(--edge2);padding:3px 8px;font-size:13px}
#wrap{width:100%;max-width:820px;position:relative}
#view{position:relative;overflow:hidden;line-height:0;touch-action:none;cursor:grab}
#view canvas{display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.fl{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.fl.big{font-size:24px}
#tag{position:absolute;transform:translate(-50%,-100%);text-align:center;color:#fff;font:bold 12px "Trebuchet MS",sans-serif;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;display:none}
#tag .bar{width:90px;height:8px;margin:2px auto 0}
#prog{position:absolute;left:8px;top:8px;background:#0006;color:#fff;font:bold 12px "Trebuchet MS",sans-serif;padding:3px 8px;border-radius:3px}
#hint{position:absolute;left:8px;top:34px;color:#fff;font:11px "Trebuchet MS",sans-serif;opacity:.8;text-shadow:0 0 3px #000}
#hud{display:flex;flex-wrap:wrap;gap:8px 16px;padding:6px 8px;font-size:13px;align-items:center}
.bar{width:130px;height:12px;background:#5b4a35;border:1px solid #3b2a1a;border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%}
.body{padding:8px;font-size:13px}
.slot{display:flex;justify-content:space-between;gap:6px;padding:4px 6px;border:1px solid var(--edge);background:#fffdf5;margin-bottom:4px;border-radius:3px;min-height:26px}
.r0{color:#555}.r1{color:#2a9d3f}.r2{color:#2f6fd6}.r3{color:#a23fd6}.r4{color:#e07b00;font-weight:bold}
button{font:inherit;font-size:12px;background:linear-gradient(#fff,#efe0b8);border:1px solid var(--edge2);border-radius:3px;padding:2px 8px;cursor:pointer;color:var(--ink)}
button:hover{background:#ffe9a8}button:focus-visible{outline:2px solid #2f6fd6}
button:disabled{opacity:.4;cursor:default}
small{opacity:.75}
#feed{position:absolute;left:8px;bottom:68px;font-size:12px;line-height:1.35;pointer-events:none;max-width:60%}
#feed div{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;background:#3b2a1acc;padding:5px 8px;border-radius:14px;border:2px solid var(--edge)}
.ib{position:relative;width:40px;height:40px;font-size:20px;line-height:1;padding:0;background:linear-gradient(#fff8e6,#e9d39a);border:2px solid var(--edge2);border-radius:10px;transition:transform .12s}
.ib:hover{transform:translateY(-2px)}.ib.on{background:#ffe08a;transform:translateY(-4px)}
.ib .k{position:absolute;right:3px;bottom:0;font-size:9px;font-weight:bold;opacity:.7}
.ib .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;background:#e5484d;border:2px solid #fff;border-radius:50%}
#wnd{position:absolute;right:8px;top:8px;bottom:68px;width:min(340px,calc(100% - 16px));display:none;flex-direction:column;pointer-events:auto;overflow:hidden;z-index:10}
#wnd .title{display:flex;justify-content:space-between;align-items:center}
#wb{overflow:auto;flex:1}
.hd{font-weight:bold;margin-bottom:6px}.full{width:100%;margin-top:8px;padding:5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pbar{height:8px;background:#5b4a35;border-radius:4px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:#4aa3df}
</style>
</head>
<body>
<div id="wrap" class="win">
  <div class="title" id="stageTitle">Prontera Field 1</div>
  <div id="view"><div id="ov"><div id="prog"></div><div id="tag"><b id="tn"></b><div class="bar"><i id="th" style="background:var(--hp)"></i></div></div><div id="hint">Drag to rotate &middot; Scroll to zoom</div><div id="feed"></div><div id="dock"></div><div id="wnd" class="win"><div class="title"><span id="wt"></span><button id="wx">&#10005;</button></div><div class="body" id="wb"></div></div></div></div>
  <div id="hud">
    <div><b id="cls2"></b> Lv <b id="lv">1</b></div>
    <div>HP <div class="bar"><i id="hpb" style="background:var(--hp)"></i></div></div>
    <div>SP <div class="bar"><i id="spb" style="background:#7a5ce0"></i></div></div>
    <div>EXP <div class="bar"><i id="xpb" style="background:var(--exp)"></i></div></div>
    <div style="color:var(--gold)">&#9679; <b id="zeny">0</b> Zeny</div>
    <div>Kills <b id="kills">0</b></div>
    <div style="margin-left:auto"><button id="spd">Speed x1</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const RAR=[{n:'Common',m:1,w:60},{n:'Fine',m:1.4,w:25},{n:'Rare',m:2,w:10},{n:'Epic',m:3,w:4},{n:'Legendary',m:5,w:1}];
const GRADE=['Common','Uncommon','Rare','Legendary'],GI=[0,1,2,4],CV=[1,2,3,5];
const SLOTS={weapon:{label:'Weapon',stat:'ATK'},armor:{label:'Armor',stat:'DEF'},head:{label:'Headgear',stat:'HP'}};
const STATS=[['str','STR','ATK'],['agi','AGI','ASPD, Flee'],['dex','DEX','Hit, min dmg'],['luk','LUK','Crit, drops'],['int','INT','SP, skill dmg']];
const SU=k=>k.toUpperCase(),MOBS_PER_STAGE=5,BX_=7.5,Z0=-3,Z1=4,MAXSTAGE=25;

const CL=(aspd,atk,hp,col,cape,wt,next,lv,main,rng,hat)=>({aspd,atk,hp,col,cape,wt,next,lv,main,rng,hat});
const CLASSES={
  Novice:CL(1,1,1,0xe8dcc0,0,['dagger','sword'],['Thief','Mage','Archer','Warrior','Merchant'],10,'str',0),
  Thief:CL(.9,1.1,.95,0x4a7c3a,0x2e7d32,['dagger'],['Assassin'],25,'agi',0),
  Assassin:CL(.78,1.25,1,0x2c2c3c,0x1b1b28,['dagger','katar'],[],0,'agi',0),
  Mage:CL(1.05,1.15,.8,0x5a3fa0,0,['staff'],['Wizard'],25,'int',1,0x5a3fa0),
  Wizard:CL(1,1.35,.85,0x2f4fa0,0,['staff'],[],0,'int',1,0x1f2f70),
  Archer:CL(.9,1.1,.9,0x6a9a4a,0x4a6a2a,['bow'],['Hunter'],25,'dex',1),
  Hunter:CL(.8,1.28,.95,0x8a6a3a,0x5a3a1a,['bow'],[],0,'dex',1),
  Warrior:CL(1,1.15,1.3,0xa04a3a,0x7a2a2a,['sword'],['Knight'],25,'str',0),
  Knight:CL(.92,1.3,1.5,0xb8b8c8,0xc03030,['sword'],[],0,'str',0),
  Merchant:CL(1,1.15,1.15,0xc9a03a,0x8a6a1a,['axe'],['Blacksmith'],25,'str',0),
  Blacksmith:CL(.95,1.3,1.3,0x6a5a4a,0x3a2a1a,['axe'],[],0,'str',0)};
const FAM={Thief:['Thief','Assassin'],Mage:['Mage','Wizard'],Archer:['Archer','Hunter'],Warrior:['Warrior','Knight'],Merchant:['Merchant','Blacksmith'],All:Object.keys(CLASSES)};
const fam=x=>FAM[x]||[x];

const act=(id,n,c,sp,cd,mul,hits,col)=>({id,n,cls:fam(c),max:5,type:'act',sp,cd,mul,hits,col,d:L=>`Auto: ${hits>1?hits+' hits of ':''}${Math.round(mul(L)*100)}% dmg. SP ${sp}`});
const pas=(id,n,c,key,f,txt)=>({id,n,cls:fam(c),max:5,type:'pas',key,f,d:L=>txt.replace('#',f(L))});
const SKILLS=[
  {id:'aid',n:'First Aid',cls:fam('All'),max:5,type:'heal',sp:5,cd:6,d:L=>`Auto: heals ${10+5*L}% HP when below half.`},
  pas('dbl','Double Attack','Thief','dbl',L=>10+8*L,'#% chance to strike twice.'),
  act('env','Envenom','Thief',8,2.5,L=>1.2+.3*L,1,'#7dff7d'),
  pas('dodge','Improve Dodge','Thief','flee',L=>3*L,'Flee +#%.'),
  act('sonic','Sonic Blow','Assassin',20,4,L=>.5+.1*L,6,'#ff9dff'),
  act('grim','Grimtooth','Assassin',12,2.5,L=>1.1+.25*L,2,'#ff6b6b'),
  pas('katm','Katar Mastery','Assassin','atk',L=>4*L,'ATK +#%.'),
  act('fire','Fire Bolt','Mage',12,1.5,L=>.7+.15*L,3,'#ff8a3d'),
  act('nap','Napalm Beat','Mage',6,1.2,L=>.9+.2*L,1,'#c9a0ff'),
  pas('spr','SP Recovery','Mage','sp',L=>.3*L,'SP regen +#/s.'),
  act('storm','Storm Gust','Wizard',30,5,L=>.4+.1*L,8,'#8fe9ff'),
  act('jup','Jupitel Thunder','Wizard',18,3,L=>.8+.15*L,4,'#ffee55'),
  pas('amp','Amplify Magic','Wizard','atk',L=>5*L,'MATK +#%.'),
  act('dstr','Double Strafe','Archer',10,1.5,L=>.8+.15*L,2,'#ffd28a'),
  pas('owl',"Owl's Eye",'Archer','atk',L=>3*L,'ATK +#%.'),
  pas('vult',"Vulture's Eye",'Archer','crit',L=>2*L,'Crit +#%.'),
  act('blitz','Blitz Beat','Hunter',18,3,L=>.7+.12*L,3,'#ffd23f'),
  act('sharp','Sharp Shooting','Hunter',22,4,L=>2+.5*L,1,'#ff4d4d'),
  pas('beast','Beast Bane','Hunter','atk',L=>4*L,'ATK +#%.'),
  act('bash','Bash','Warrior',8,2,L=>1.4+.3*L,1,'#ffb347'),
  pas('endure','Endure','Warrior','def',L=>2*L,'DEF +#.'),
  pas('hprec','HP Recovery','Warrior','hpreg',L=>.3*L,'Regen +#% HP/s.'),
  act('bowl','Bowling Bash','Knight',20,4,L=>.9+.2*L,2,'#ffe14d'),
  act('pierce','Pierce','Knight',14,2.5,L=>.7+.12*L,3,'#ff9d5c'),
  pas('quick','Two-Hand Quicken','Knight','aspd',L=>4*L,'ASPD +#%.'),
  act('mammo','Mammonite','Merchant',10,2.5,L=>1.6+.35*L,1,'#ffd23f'),
  pas('greed','Overcharge','Merchant','zeny',L=>8*L,'Zeny gain +#%.'),
  pas('phys','Physical Training','Merchant','hpp',L=>4*L,'Max HP +#%.'),
  act('hammer','Hammer Fall','Blacksmith',20,4,L=>2.4+.5*L,1,'#ff7a1a'),
  pas('adren','Adrenaline Rush','Blacksmith','aspd',L=>5*L,'ASPD +#%.'),
  pas('wperf','Weapon Perfection','Blacksmith','atk',L=>4*L,'ATK +#%.')];

const T8=['dagger','katar','staff','bow','axe','sword','armor','head'];
const M_=(n,c,s)=>({n,c,shape:s});
const MAPS=[
 {n:'Prontera',boss:M_('Mastering',0x7ad46a,'blob'),gear:{dagger:'Main Gauche',katar:'Jur',staff:'Rod',bow:'Short Bow',axe:'Hand Axe',sword:'Sword',armor:'Cotton Shirt',head:'Hat'},
  f:[[M_('Poring',0xff9db8,'blob'),M_('Fabre',0x9ed35a,'worm')],[M_('Lunatic',0xf4f4f4,'bunny'),M_('Drops',0xffb45a,'blob')],[M_('Chonchon',0x6fa8dc,'bug'),M_('Willow',0x6fa84a,'tree')],[M_('Rocker',0x9ac04a,'bug'),M_('Poporing',0x8ad04a,'blob')],[M_('Savage Bebe',0xb08a5a,'cat'),M_('Peco Peco',0xf0d060,'bug')]]},
 {n:'Izlude',boss:M_('Drake',0x4a5a8a,'demon'),gear:{dagger:'Stiletto',katar:'Katar',staff:'Wand',bow:'Composite Bow',axe:'Axe',sword:'Falchion',armor:'Padded Armor',head:'Sailor Cap'},
  f:[[M_('Marina',0x5ad1c8,'blob'),M_('Pupa',0xe0c070,'worm')],[M_('Crab',0xe0605a,'bug'),M_('Sea Otter',0x8a6a4a,'cat')],[M_('Muka',0x6aa84f,'tree'),M_('Anacondaq',0x3f8a3f,'worm')],[M_('Thief Bug',0x3a3a55,'bug'),M_('Marse',0x6a8ae0,'blob')],[M_('Ambernite',0xe07aa0,'worm'),M_('Kukre',0xd98a3a,'bug')]]},
 {n:'Geffen',boss:M_('Baphomet',0x6a3fa0,'demon'),gear:{dagger:'Damascus',katar:'Jamadhar',staff:'Staff of Soul',bow:'Great Bow',axe:'Battle Axe',sword:'Claymore',armor:'Mage Robe',head:'Wizard Hat'},
  f:[[M_('Skeleton',0xe8e8e8,'bunny'),M_('Zombie',0x7a9a6a,'worm')],[M_('Ghoul',0x6a7a5a,'demon'),M_('Poison Spore',0x8a5aa0,'tree')],[M_('Whisper',0xbfd0ff,'blob'),M_('Bat Familiar',0x5a3a6a,'bug')],[M_('Dark Priest',0x3a2a4a,'demon'),M_('Wraith',0x8a8ab0,'blob')],[M_('Evil Druid',0x4a3a5a,'tree'),M_('Marionette',0xff8ad0,'bunny')]]},
 {n:'Morroc',boss:M_('Phreeoni',0xc9a040,'bug'),gear:{dagger:'Sword Breaker',katar:'Scratcher',staff:'Bone Wand',bow:'Crossbow',axe:'Golden Axe',sword:'Scimitar',armor:'Desert Coat',head:'Turban'},
  f:[[M_('Scorpion',0xd9a84a,'bug'),M_('Sand Man',0xe0c78a,'blob')],[M_('Desert Wolf',0xc9a86a,'cat'),M_('Cactus',0x5aa050,'tree')],[M_('Pasana',0xc94a2a,'demon'),M_('Horn',0xa08050,'bug')],[M_('Mummy',0xd9d0b0,'worm'),M_('Isis',0xffcf6a,'cat')],[M_('Anubis',0x2a2a3a,'demon'),M_('Minorous',0x8a4a2a,'demon')]]},
 {n:'Payon',boss:M_('Eddga',0xe67a2e,'cat'),gear:{dagger:'Cinquedea',katar:'Poison Katar',staff:'Bamboo Staff',bow:'Hunter Bow',axe:'Tomahawk',sword:'Broad Sword',armor:'Hunter Suit',head:'Straw Hat'},
  f:[[M_('Spore',0xd06a6a,'tree'),M_('Wolf',0x8a8a95,'cat')],[M_('Elder Willow',0x4a7a3a,'tree'),M_('Hornet',0xe8c840,'bug')],[M_('Bigfoot',0x9a7a5a,'demon'),M_('Zenorc',0x5a8a4a,'demon')],[M_('Skel Archer',0xd0d0c0,'bunny'),M_('Ancient Worm',0xb0a080,'worm')],[M_('Orc Warrior',0x4a7a3a,'demon'),M_('Orc Archer',0x6a8a3a,'demon')]]}];
const K5=['str','agi','dex','luk','int'],FIELDS=[];
MAPS.forEach((mp,mi)=>mp.f.forEach((pair,fi)=>{const stage=mi*5+fi+1;
  FIELDS.push({map:mp,mi,fi,stage,mobs:pair.map((m,j)=>{const li=fi*2+j,gi=(stage-1)*2+j;
    return{...m,drops:[[T8[li%8],6],[T8[(li*3+1)%8],5]],card:{n:m.n+' Card',stat:K5[(gi*3+1)%5],g:stage<=8?0:stage<=16?1:2},cardCh:1.5}}),
    boss:{...mp.boss,drops:T8.map(k=>[k,12]),card:{n:mp.boss.n+' Card',stat:K5[(mi*2)%5],g:3},cardCh:10}})}));
const gname=(mp,k)=>mp.gear[k]+(k==='armor'||k==='head'?'':' ('+k+')');
const AFF=['str','agi','dex','luk','int','hp'];

let S,speed=1,floats=[],drops=[],t=0,shake=0,atkAnim=0,hitAnim=0,pend=[],shots=[],barT=0,logs=[],tab=null;
const pl={x:-3,z:1.5,ry:0,orb:0,run:0},skCd={aid:0};
const uid=()=>Date.now()+Math.random();
const fresh=()=>({cls:'Novice',lv:1,exp:0,hp:100,sp:30,zeny:0,kills:0,stage:1,best:1,killsInStage:0,pts:10,skp:0,sk:{aid:1},auto:true,autoAdv:true,q:null,cards:[],
  st:{str:1,agi:1,dex:1,luk:1,int:1},eq:{weapon:{id:1,slot:'weapon',wt:'dagger',tier:0,val:3,name:'Novice Knife',aff:[],slots:1,cards:[],st:1},armor:null,head:null},inv:[]});
function load(){try{const s=JSON.parse(localStorage.getItem('pg_save2')||localStorage.getItem('pg_save'));if(s&&s.lv){const f=Object.assign(fresh(),s);f.st=Object.assign(fresh().st,s.st||{});if(!s.st)f.pts=10+(s.lv-1)*3;if(!s.sk){f.sk={aid:1};f.skp=Math.max(0,s.lv-1)}if(!CLASSES[f.cls])f.cls='Novice';f.stage=Math.min(MAXSTAGE,f.stage);f.best=Math.min(MAXSTAGE,f.best);return f}}catch(e){}return fresh()}
function save(){try{localStorage.setItem('pg_save2',JSON.stringify(S))}catch(e){}}
S=load();

const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const isBoss=()=>S.stage%5===0,C=()=>CLASSES[S.cls],FLD=()=>FIELDS[S.stage-1],fieldName=s=>`${FIELDS[s-1].map.n} Field ${FIELDS[s-1].fi+1}`;
const lv=id=>S.sk[id]||0,skillOn=id=>lv(id)>0&&SKILLS.find(s=>s.id===id).cls.includes(S.cls);
const pv=k=>SKILLS.reduce((a,s)=>a+(s.type==='pas'&&s.key===k&&skillOn(s.id)?s.f(lv(s.id)):0),0);
const items=()=>Object.values(S.eq).filter(Boolean),ev=it=>Math.round(it.val*(1+(it.r||0)*.12)),iname=it=>(it.r?'+'+it.r+' ':'')+it.name;
const eqv=k=>S.eq[k]?ev(S.eq[k]):0;
const bon=k=>{let v=0;for(const it of items()){for(const a of it.aff||[])if(a.k===k)v+=a.v;for(const c of it.cards||[])if(c.stat===k)v+=c.v}return v};
const st=k=>S.st[k]+bon(k),canUse=it=>it.slot!=='weapon'||!it.wt||C().wt.includes(it.wt);
const maxHp=()=>Math.round((80+S.lv*20+eqv('head')*4+bon('hp'))*C().hp*(1+pv('hpp')/100)),maxSp=()=>20+S.lv*2+st('int')*3;
const atk=()=>Math.round((4+S.lv*2+eqv('weapon')+st(C().main)*1.5+(st('dex')+st('luk'))*.25)*C().atk*(1+pv('atk')/100));
const aspd=()=>Math.max(.25,.85*C().aspd*(1-Math.min(.5,st('agi')*.006))/(1+pv('aspd')/100));
const crit=()=>Math.min(60,3+st('luk')*.4+pv('crit')),flee=()=>Math.min(60,st('agi')*.5+S.lv*.1+pv('flee')),missCh=()=>Math.max(0,15-st('dex')*.25);
const def=()=>Math.floor(S.lv*.5+eqv('armor')+pv('def')),need=()=>Math.floor(20*Math.pow(S.lv,1.6)),cost=k=>1+Math.floor((S.st[k]-1)/10);
const totalPts=()=>{let p=10;for(let l=2;l<=S.lv;l++)p+=3+Math.floor(l/5);return p},rcost=()=>S.lv*50;
const refCost=it=>Math.round(120*((it.r||0)+1)*(1+it.tier*.6)*(1+S.stage*.15)),refCh=it=>[100,100,100,100,70,60,50,40,30,20][it.r||0];
const affTxt=a=>`${SU(a.k)} +${a.v}`,cardTxt=c=>`${c.n} (${SU(c.stat)} +${c.v})`;

let mob=null,pAtkT=0,mAtkT=0,respawn=0;
function spawn(){
  const F=FLD(),boss=isBoss()&&S.killsInStage>=MOBS_PER_STAGE,lvl=S.stage;
  if(boss){const b=F.boss,hp=Math.floor(240*Math.pow(lvl,1.35));
    mob={...b,boss:true,hp,max:hp,atk:Math.floor(6+lvl*2.4),exp:60*lvl,zeny:ri(40,70)*lvl,size:1.9,stage:lvl}}
  else{const m=F.mobs[ri(0,1)],hp=Math.floor(28*Math.pow(lvl,1.3));
    mob={...m,boss:false,hp,max:hp,atk:Math.floor(3+lvl*1.6),exp:Math.floor(11.7*lvl),zeny:ri(4,9)*lvl,size:1,stage:lvl}}
  mob.x=pl.x>0?rnd(-BX_,-4):rnd(4,BX_);mob.z=rnd(Z0,Z1);mob.spawn=0;mob.ry=0;pAtkT=.3;mAtkT=.6;
}

function genGear(key,stg,boss){
  const mp=MAPS[Math.floor((stg-1)/5)],slot=key==='armor'||key==='head'?key:'weapon';
  let roll=rnd(0,100)-(boss?25:0)-st('luk')*.15,tier=0,acc=0;for(let i=0;i<5;i++){acc+=RAR[i].w;if(roll<acc||i==4){tier=i;break}}
  if(boss&&tier<2)tier=2;
  const val=Math.max(1,Math.round({weapon:3,armor:2,head:6}[slot]*(1+stg*.55)*RAR[tier].m*rnd(.9,1.15)));
  const aff=[],n=(tier>=3||Math.random()<.4)?2:1,pool=AFF.slice();
  for(let i=0;i<n;i++){const k=pool.splice(ri(0,pool.length-1),1)[0];aff.push({k,v:k==='hp'?ri(1,3+tier+Math.floor(stg/6))*10:ri(1,1+tier+Math.floor(stg/8))})}

        if(Math.random()*100<flee())addFloat(pl.x,2.4,pl.z,'Miss','#8cf');
        else{const d=Math.max(1,Math.round(mob.atk*rnd(.8,1.2)-def()*.6));S.hp-=d;hitAnim=1;addFloat(pl.x,2.4,pl.z,d,'#ff6b6b');
          if(S.hp<=0){log('You were defeated... resting and retrying the field.','r0');S.hp=maxHp();S.killsInStage=0;mob=null;respawn=1.5;pend=[];ui()}}}
    }
  }
  const px=tx-pl.x,pz=tz-pl.z,pd=Math.hypot(px,pz),spd=6.5+st('agi')*.05;pl.run=pd>.15;
  if(pd>.05){const s=Math.min(pd,spd*dt*(pd>3?1.4:1));pl.x+=px/pd*s;pl.z+=pz/pd*s}
  pl.x=cl(pl.x,-BX_,BX_);pl.z=cl(pl.z,Z0,Z1);
  if(mob)pl.ry=-Math.atan2(mob.z-pl.z,mob.x-pl.x);else if(pl.run)pl.ry=-Math.atan2(pz,px);
  if(S.hp<maxHp()&&Math.floor(t*2)!==Math.floor((t-dt)*2))S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*.008));
  barT-=dt;if(barT<=0){barT=.15;bars()}
  floats.forEach(f=>{f.life-=dt*1.1;f.y+=dt*.8});floats=floats.filter(f=>{if(f.life>0)return true;if(f.el)f.el.remove();return false});
  drops.forEach(d=>{d.t+=dt;d.vy+=700*dt;d.y+=d.vy*dt;if(d.y>0){d.y=0;d.vy=-d.vy*.4;if(Math.abs(d.vy)<40)d.vy=0}});
  for(let i=drops.length-1;i>=0;i--)if(drops[i].t>.9){collect(drops[i].it);drops.splice(i,1)}
}

const view=$('view'),ov=$('ov'),tag=$('tag'),prog=$('prog');

const TC=[0xbbbbbb,0x5cb85c,0x4a86e8,0xb05ce0,0xffb020];
const M=c=>new THREE.MeshLambertMaterial({color:c});

      CN=(r,h)=>new THREE.ConeGeometry(r,h,8),CY=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,8);
function mk(p,geo,c,x=0,y=0,z=0){const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}

let sd=7;const sr=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<70;i++){const x=(sr()-.5)*50,z=(sr()-.3)*30;if(Math.abs(x)<11.5||z<-3||z>14)continue;
  const T=new THREE.Group();mk(T,CY(.15,.22,1.3),0x6b4a2a,0,.65,0);mk(T,CN(1,2.3),sr()>.5?0x3f9b4a:0x4fae4f,0,2.3,0);T.position.set(x,0,z);T.scale.setScalar(.8+sr()*.7);scene.add(T)}
for(let i=0;i<90;i++){const x=(sr()-.5)*44,z=(sr()-.4)*24;if(Math.abs(x)<11.2&&z>-5.1&&z<5.8)continue;
  mk(scene,SP(.09),[0xff9db8,0xffe066,0xffffff][i%3],x,.08,z).castShadow=false}

function bld(x,z,w,d,h,wall,roof,pk){const G=new THREE.Group();mk(G,BX(w,h,d),wall,0,h/2,0);
  const r=mk(G,new THREE.ConeGeometry(Math.max(w,d)*.78,pk||h*.6,4),roof,0,h+(pk||h*.6)/2,0);r.rotation.y=Math.PI/4;
  mk(G,BX(.9,1.4,.1),0x6b4a2a,0,.7,d/2+.02);
  for(const wx of[-w*.3,w*.3])mk(G,BX(.6,.6,.1),0x9ad7f5,wx,h*.62,d/2+.02);
  G.position.set(x,0,z);scene.add(G);return G}
[[-15,-8.5,4,4,3,0xf3e6c8,0xc0453a],[-10.5,-7.6,3.6,3.6,4,0xefe0bd,0xb3392f],[-6,-8,3.4,4,2.6,0xf6ecd4,0xd0574a],
 [6,-7.8,3.6,3.6,3.4,0xf3e6c8,0xc0453a],[10.5,-8.2,4,4,4.4,0xefe0bd,0x3f6fb5],[15,-8.4,4,4,3,0xf6ecd4,0xd0574a]].forEach(a=>bld(...a));

mk(scene,BX(30,1,.6),0x9a9a9a,0,.5,-5.2);
for(let x=-14;x<=14;x+=4)mk(scene,BX(.8,1.6,.8),0x8a8a8a,x,.8,-5.2);
const fnt=new THREE.Group();mk(fnt,CY(1.1,1.3,.5),0xbbbbbb,0,.25,0);mk(fnt,CY(.15,.15,1.4),0xcccccc,0,1,0);mk(fnt,CY(.7,.5,.2),0x7ec8f0,0,.45,0);fnt.position.set(0,0,-3.6);scene.add(fnt);

const P=new THREE.Group();scene.add(P);

function buildMob(m){
  const G=new THREE.Group(),mats=[],c=m.c;
  const add=(geo,col,x,y,z,sx=1,sy=1,sz=1)=>{const o=mk(G,geo,col,x,y,z);o.scale.set(sx,sy,sz);if(col===c)mats.push(o.material);return o};
  const eyes=(x,y,col=0x111111)=>{add(SP(.09),col,x,y,.22);add(SP(.09),col,x,y,-.22)};
  switch(m.shape){
    case'blob':add(SP(),c,0,.6,0,1.4,1.1,1.4);eyes(-.68,.7);break;
    case'worm':for(let i=0;i<3;i++)add(SP(.42-.04*i),c,.5-i*.5,.42,0);eyes(-.55,.62);break;
    case'bunny':add(SP(),c,0,.6,0,1.1,1.1,1.1);add(CY(.12,.15,.9),c,-.05,1.55,.2);add(CY(.12,.15,.9),c,-.05,1.55,-.2);eyes(-.5,.75,0xd33333);break;
    case'tree':add(CY(.3,.4,1),0x6b4a2a,0,.5,0);add(SP(.85),c,0,1.55,0);eyes(-.75,1.55);break;
    case'bug':add(SP(),c,0,.5,0,1.5,.8,1);add(SP(.3),c,-.8,.6,0);
      for(const z of[-.4,.4])for(const x of[-.3,.3])add(CY(.05,.05,.7),0x333333,x,.2,z);eyes(-1.02,.7,0xcc0000);break;
    case'cat':add(SP(),c,0,.65,0,1.5,1,1);add(SP(.38),c,-.85,1,0);add(CN(.14,.4),c,-.85,1.45,.22);add(CN(.14,.4),c,-.85,1.45,-.22);
      add(CY(.08,.05,1),c,.9,.9,0,1,1,1).rotation.z=-.6;eyes(-1.18,1.05,0xffffff);break;
    default:add(SP(),c,0,.9,0,1,1.5,1);add(CN(.16,.7),0xeeeeee,-.3,1.95,.3);add(CN(.16,.7),0xeeeeee,-.3,1.95,-.3);eyes(-.5,1.2,0xffee44);
  }
  scene.add(G);return{G,mats};
}
let curMob=null,mobG=null,mobMats=[],lastBoss=null,dmesh=new Map(),tmp=new THREE.Vector3(),lastProg='',curHatCol=-1;
function scr(x,y,z){tmp.set(x,y,z).project(cam);return[(tmp.x+1)/2*R.domElement.clientWidth,(1-tmp.y)/2*R.domElement.clientHeight]}

let drag=null;const dom=R.domElement;
dom.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];dom.setPointerCapture(e.pointerId)});
dom.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.006;el=Math.min(1.35,Math.max(.45,el+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});
dom.addEventListener('pointerup',()=>drag=null);dom.addEventListener('pointercancel',()=>drag=null);
dom.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2,Math.max(.6,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});

const ct=new THREE.Vector3(0,.8,0);
function draw(){
  const bn=isBoss()&&S.killsInStage>=MOBS_PER_STAGE;
  if(bn!==lastBoss){lastBoss=bn;const col=new THREE.Color(bn?0x8a6bb0:0x9ad7f5);scene.background=col;scene.fog=new THREE.Fog(col,35,80)}
  const c=C();
  P.position.set(pl.x,Math.abs(Math.sin(t*(pl.run?16:4)))*(pl.run?.14:.04),pl.z);P.rotation.set(pl.run?.12:0,pl.ry,0);
  arm.rotation.z=pl.run&&!atkAnim?-.9+Math.sin(t*16)*.5:-.25-Math.sin(atkAnim*Math.PI)*1.9;
  hair.material.color.setHex(0xd0492c);
  blade.material.color.setHex(S.eq.weapon?TC[S.eq.weapon.tier]:0xaaaaaa);blade.scale.set(1,1,1);blade.position.y=.28+.65;
  pBody.material.color.setHex(S.eq.armor?TC[S.eq.armor.tier]:c.col);pBody.material.emissive.setRGB(hitAnim*.8,0,0);
  cape.visible=!!c.cape;if(c.cape)cape.material.color.setHex(c.cape);
  
  if(c.hat!==curHatCol){curHatCol=c.hat;while(pHat.children.length)pHat.remove(pHat.children[0]);
    if(c.hat){mk(pHat,CN(.6,.5),c.hat,0,0,0);mk(pHat,CY(.8,.8,.05),c.hat,0,-.2,0)}}
  
  shots.forEach(s=>{
    if(!s.m){const g=s.arrow?BX(.05,.05,.5):SP(.15);s.m=mk(scene,g,s.col||0xffffff);s.m.material.emissive.setHex(0xffffff)}
    const p=s.t;s.m.position.set(s.x0+(s.x1-s.x0)*p,1.5+Math.sin(p*Math.PI)*.4,s.z0+(s.z1-s.z0)*p);
  });
  
  if(mob!==curMob){if(mobG)scene.remove(mobG);curMob=mob;mobG=null;if(mob){const b=buildMob(mob);mobG=b.G;mobMats=b.mats}}
  if(mob&&mobG){const s=Math.max(.01,mob.size*mob.spawn);mobG.scale.set(s,s*(1+Math.sin(t*6)*.04),s);
    mobG.position.set(mob.x,0,mob.z);mobG.rotation.y=mob.ry;mobMats.forEach(m=>m.emissive.setScalar(mob.flash||0));
    const[px,py]=scr(mob.x,1.9*s+.5,mob.z);tag.style.display='block';tag.style.left=px+'px';tag.style.top=py+'px';
    $('tn').textContent=mob.n+(mob.boss?' (BOSS)':'');$('th').style.width=Math.max(0,mob.hp/mob.max*100)+'%';
  }else tag.style.display='none';
  const live=new Set();
  drops.forEach(d=>{live.add(d);let m=dmesh.get(d);
    if(!m){if(d.it.card){m=mk(scene,BX(.35,.5,.02),GI[d.it.g]===3?0xffb020:0xa0a0a0)}
      else{const sl=d.it.slot;m=mk(scene,sl==='weapon'?BX(.14,.75,.14):sl==='armor'?BX(.45,.45,.25):SP(.24),TC[d.it.tier])}
      m.material.emissive.setHex(d.it.card?0xffb020:TC[d.it.tier]).multiplyScalar(.45);dmesh.set(d,m)}
    m.position.set(d.wx,.35+Math.max(0,-d.y)/60,d.wz);m.rotation.y=t*3});
  dmesh.forEach((m,d)=>{if(!live.has(d)){scene.remove(m);dmesh.delete(d)}});
  ct.x+=(pl.x*.6-ct.x)*.05;ct.z+=(pl.z*.5-ct.z)*.05;
  const dd=(cam.aspect<1.5?21:14)/zoom,sk=shake*.03;
  cam.position.set(ct.x+Math.sin(az)*Math.cos(el)*dd+rnd(-sk,sk),Math.sin(el)*dd+.5,ct.z+Math.cos(az)*Math.cos(el)*dd+rnd(-sk,sk));
  cam.lookAt(ct);R.render(scene,cam);
  floats.forEach(f=>{if(!f.el){const e=document.createElement('div');e.className='fl'+(f.big?' big':'');e.textContent=f.txt;e.style.color=f.col;ov.appendChild(e);f.el=e}
    const[a,b]=scr(f.x,f.y,f.z);f.el.style.left=a+'px';f.el.style.top=b+'px';f.el.style.opacity=Math.max(0,f.life)});
  const done=Math.min(S.killsInStage,MOBS_PER_STAGE),pt=bn?'BOSS FIGHT':`Monsters ${done}/${MOBS_PER_STAGE}${isBoss()?' \u2192 Boss':''}`;
  if(pt!==lastProg){lastProg=pt;prog.textContent=pt}
}
