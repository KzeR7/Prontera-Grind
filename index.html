<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontera Grind</title>
<style>
:root{--ink:#3b2a1a;--panel:#fff8e6;--edge:#c9a35b;--edge2:#8a6a2c;--hp:#e5484d;--exp:#4aa3df;--gold:#e8a800}
*{box-sizing:border-box}
html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#2b3a55; font-family:"Trebuchet MS",Verdana,sans-serif; color:var(--ink); }

.win{background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--edge2),0 4px 0 2px var(--edge2)}
.title{font-weight:bold;background:linear-gradient(#f3d98b,#d9b25c);border-bottom:2px solid var(--edge2);padding:4px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#wrap{width:100vw;height:100vh;display:flex;flex-direction:column;border:none;border-radius:0;box-shadow:none}
#view{position:relative;flex:1;width:100%;line-height:0;touch-action:none;cursor:grab;overflow:hidden}
#view canvas{width:100% !important;height:100% !important;display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
#mobSpriteLayer,#weaponSpriteLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;user-select:none}
#mobSpriteLayer{z-index:0}#weaponSpriteLayer{z-index:1}
.mob-sprite-img{position:absolute;left:0;top:0;transform:translate(-50%,-100%);object-fit:contain;image-rendering:pixelated;pointer-events:none;user-select:none}
.weapon-sprite-wrap{position:absolute;left:0;top:0;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:none;user-select:none;filter:drop-shadow(1px 2px 2px #000b)}
.weapon-sprite-wrap img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.weapon-sprite-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--weapon-size, 34px) * .76);line-height:1;text-shadow:0 1px 2px #000}
.fl{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.fl.big{font-size:24px}
.fl{pointer-events:none}
/* RO-style damage: outlined golden digits; crits sit on a red spiked bubble. */
.fl.damage,.fl.critical,.fl.incoming{font-family:Verdana,"Trebuchet MS",sans-serif;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#ffe643!important;-webkit-text-stroke:1.5px #30221e;paint-order:stroke fill;text-shadow:1px 2px 0 #120e0b,0 0 3px #140d08;z-index:24;animation:hit-pop .24s ease-out both}
.fl.critical{font-size:26px;color:#fff264!important;isolation:isolate}
.fl.critical::before{content:"";position:absolute;z-index:-1;inset:-13px -19px;background:radial-gradient(ellipse,#f79b50 5%,#d83e32 43%,#a6232f 66%,#711626 100%);clip-path:polygon(50% 0%,57% 18%,70% 5%,72% 24%,88% 12%,85% 32%,100% 29%,89% 46%,100% 55%,83% 62%,91% 81%,72% 74%,65% 100%,53% 79%,39% 97%,35% 77%,16% 88%,20% 66%,0% 64%,14% 48%,1% 36%,20% 33%,12% 13%,32% 24%,40% 4%)}
.fl.incoming{color:#ff7772!important;font-size:18px}
.fl.skill{font:bold 14px "Trebuchet MS",sans-serif;color:#fff!important;background:#262233d9;border:1px solid #ffda7a;border-radius:4px;padding:3px 9px;letter-spacing:.2px;text-shadow:0 1px 2px #000,0 0 5px #000;box-shadow:0 2px 8px #0008;z-index:25}
@keyframes hit-pop{0%{transform:translate(-50%,-35%) scale(.65)}65%{transform:translate(-50%,-55%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}
#tag{position:absolute;transform:translate(-50%,-100%);text-align:center;color:#fff;font:bold 12px "Trebuchet MS",sans-serif;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;display:none}
#tag .bar{width:90px;height:8px;margin:2px auto 0}
#prog{position:absolute;left:12px;top:12px;background:#0008;color:#fff;font:bold 13px "Trebuchet MS",sans-serif;padding:6px 12px;border-radius:4px;border:1px solid #ffffff44;display:flex;align-items:center;gap:10px}
#hint{position:absolute;left:12px;top:52px;color:#fff;font:11px "Trebuchet MS",sans-serif;opacity:.8;text-shadow:0 0 3px #000}
#hud{display:flex;flex-wrap:wrap;gap:10px 22px;padding:9px 16px;font-size:13px;align-items:center;background:linear-gradient(180deg,#fff9e9,#f4e5c4);border-top:1px solid var(--edge);z-index:10;box-shadow:0 -4px 14px #241b1730}
#hudBuffs{display:none;flex-wrap:wrap;gap:6px;flex-basis:100%}
.pbf{font-size:11px;background:#ffe9a8;border:1px solid var(--edge2);border-radius:10px;padding:1px 8px}
.pbf i{font-style:normal;opacity:.75}
.bar{width:148px;height:14px;background:#3b302b;border:1px solid #574637;border-radius:999px;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px #1e1617aa,0 1px 0 #fff9}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .3s ease,background .3s ease}
.hud-health{display:flex;align-items:center;gap:7px;white-space:nowrap}.hud-health small{font-weight:bold;min-width:34px;text-align:right}
#hpb{background:linear-gradient(180deg,#7cec8f,#20a74c 65%,#17883a);box-shadow:inset 0 1px #f3fff588,0 0 8px #30c75677}
#hpb.critical{background:linear-gradient(180deg,#ff8e81,#ed4242 60%,#b92031);box-shadow:inset 0 1px #fff7,0 0 8px #e54949aa}
.hud-zeny{position:relative;color:#a27200;font-weight:bold;cursor:help;white-space:nowrap}.hud-zeny:focus-visible,.xp-side:focus-visible{outline:2px solid #2f6fd6;outline-offset:-2px}
.hud-flyout{position:absolute;bottom:calc(100% + 8px);left:0;z-index:90;background:#251f20;color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px;white-space:nowrap;box-shadow:0 4px 14px #0008;opacity:0;visibility:hidden;pointer-events:none}
.hud-zeny:hover .hud-flyout,.hud-zeny:focus .hud-flyout{opacity:1;visibility:visible}
#xp-dock{flex:none;width:100%;padding:3px 10px 4px;background:linear-gradient(180deg,#413743,#26242f);box-shadow:inset 0 2px 6px #140f1899;z-index:9}
/* One RO-style bar: Base fills toward the centre from the left, Job from the right. */
#xp-track{display:flex;width:100%;height:14px;border:1px solid #756c77;border-radius:4px;background:#161820;overflow:hidden;box-shadow:inset 0 1px 4px #000a;color:#fff;font:bold 9px/12px "Trebuchet MS",sans-serif;text-shadow:0 1px 2px #000,0 0 4px #000}
.xp-side{position:relative;flex:0 0 50%;min-width:0;cursor:help;overflow:hidden}.xp-side:first-child{border-right:2px solid #d6c2a6}.xp-side:hover{background:#ffffff12}
.xp-fill{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .3s ease}
#jb{left:auto;right:0;background:linear-gradient(180deg,#bca0ff,#7452cb 70%,#493692)}#xpb{background:linear-gradient(180deg,#9ce6ff,#348fcc 70%,#246398)}
.xp-label,.xp-pct{position:absolute;top:0;z-index:1;white-space:nowrap}.xp-label{left:8px}.xp-label.job{left:auto;right:8px}.xp-pct{left:50%;transform:translateX(-50%)}
@media(max-width:560px){#hud{gap:6px 10px;padding:7px 10px;font-size:11px}.hud-health .bar{width:94px}.hud-health small{min-width:28px}#xp-track{height:22px}.xp-label,.xp-label.job{left:0;right:0;top:0;text-align:center;font-size:9px;line-height:10px}.xp-pct{top:10px;line-height:10px;font-size:9px}}
.body{padding:8px;font-size:13px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--edge);background:#fffdf5;margin-bottom:4px;border-radius:4px;min-height:36px}
.r0{color:#555}.r1{color:#2a9d3f}.r2{color:#2f6fd6}.r3{color:#a23fd6}.r4{color:#e07b00;font-weight:bold}
button{font:inherit;font-size:12px;background:linear-gradient(#fff,#efe0b8);border:1px solid var(--edge2);border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--ink)}
button:hover{background:#ffe9a8}button:focus-visible{outline:2px solid #2f6fd6}
.wide{grid-column:1/-1}small{opacity:.7}button:disabled{opacity:.4;cursor:default}
#feed{position:absolute;left:12px;bottom:76px;font-size:13px;line-height:1.4;pointer-events:none;max-width:50%}
#feed div{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;background:#3b2a1acc;padding:6px 10px;border-radius:14px;border:2px solid var(--edge)}
.ib{position:relative;width:42px;height:42px;font-size:20px;line-height:1;padding:0;background:linear-gradient(#fff8e6,#e9d39a);border:2px solid var(--edge2);border-radius:10px;transition:transform .12s}
.ib:hover{transform:translateY(-2px)}.ib.on{background:#ffe08a;transform:translateY(-4px)}
.ib .k{position:absolute;right:3px;bottom:0;font-size:8px;font-weight:bold;opacity:.7}
.ib .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;background:#e5484d;border:2px solid #fff;border-radius:50%}
#wnd{position:absolute;right:12px;top:12px;bottom:76px;width:min(420px,calc(100% - 24px));display:none;flex-direction:column;pointer-events:auto;overflow:hidden;z-index:20}
#wb{overflow:auto;flex:1}
.hd{font-weight:bold;margin-bottom:6px}.full{width:100%;margin-top:8px;padding:6px}
.pbar{height:8px;background:#5b4a35;border-radius:4px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:#4aa3df}


/* Login Modal Overlay */
#loginOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 999; display: flex; align-items: center; justify-content: center; }
.login-card { width: min(340px, 90vw); padding: 20px; background: var(--panel); border: 3px solid var(--edge); border-radius: 8px; box-shadow: 0 0 0 2px var(--edge2), 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
.login-card h2 { margin: 0 0 4px 0; font-size: 20px; color: var(--ink); }
.login-card p { font-size: 12px; margin-bottom: 16px; opacity: 0.8; }
.form-group { margin-bottom: 12px; text-align: left; }
.form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input { width: 100%; padding: 8px 10px; border: 1px solid var(--edge2); border-radius: 4px; background: #fffdf5; font: inherit; font-size: 13px; }
.login-btn { width: 100%; padding: 8px; font-weight: bold; font-size: 14px; margin-top: 6px; }
.login-err { color: #e5484d; font-size: 12px; margin-top: 8px; min-height: 16px; font-weight: bold; }
.login-footer { margin-top: 14px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.job-card { background: #fffdf5; border: 2px solid var(--edge); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.gm-badge { background: #e5484d; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; margin-left: 6px; }
.mob-card { background: #fffdf5; border: 1px solid var(--edge); border-radius: 6px; padding: 8px; margin-bottom: 8px; }

#tooltip{position:fixed;pointer-events:none;z-index:1000;display:none;width:230px;padding:10px;background:#1f1710f8;color:#fff;border:2px solid var(--edge);border-radius:6px;font-size:12px;box-shadow:0 4px 12px #0008}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{font-weight:bold;margin:10px 0 4px;border-bottom:1px solid var(--edge2)}
hr{border:0;border-top:1px dashed var(--edge);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:2px solid var(--edge2);border-radius:6px;background:#2b1f14;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;min-width:0}.pet-icon{display:block;width:34px;height:34px;object-fit:contain;image-rendering:pixelated;pointer-events:none}.pet-icon.small{display:inline-block;width:22px;height:22px;vertical-align:middle}
.cell.empty{opacity:.35;cursor:default}.cell.sel{outline:3px solid #ffe08a}
.cell.b1{border-color:#5cb85c}.cell.b2{border-color:#4a86e8}.cell.b3{border-color:#b05ce0}.cell.b4{border-color:#ffb020;box-shadow:0 0 7px #ffb020}
.cell .rf{position:absolute;right:2px;bottom:0;font:bold 10px sans-serif;color:#ffe08a;font-style:normal;text-shadow:0 0 2px #000}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,72px),1fr));gap:5px;margin:4px 0;min-width:0}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,76px),1fr));gap:5px;margin:4px 0;min-width:0}
.mapcard{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 6px;text-align:left;line-height:1.2;border:2px solid var(--edge);background:#fffdf5;border-radius:6px;cursor:pointer;overflow:hidden}
.mapcard:hover{background:#ffe9a8}.mapcard b{font-size:11px;white-space:nowrap;text-overflow:ellipsis;max-width:100%;overflow:hidden}.mapcard small{font-size:9px;opacity:.7}
.mapcard.on{background:#ffe08a;border-color:var(--gold)}
.mapcard.here{box-shadow:inset 0 0 0 2px #2f6fd6}
.wp.wide{flex:0 1 450px;width:450px;min-width:0}
.mapband{padding:2px 0 6px;min-width:0}
.mapband.fields{position:sticky;top:-1px;z-index:2;background:var(--panel);padding-top:4px;border-top:1px solid var(--edge2)}
.mapband.fields .mapband-t{position:sticky;top:-1px;background:var(--panel)}
.mapband-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:bold;margin:2px 0 4px;min-width:0}
.mapband-t small{font-weight:normal;opacity:.75;min-width:0;flex:1 1 180px;overflow-wrap:anywhere}
.mapband-t button.go{margin-left:auto;padding:5px 12px;font-weight:bold;white-space:normal;max-width:100%}
.mapcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:8px;align-items:stretch;margin-top:8px;min-width:0}
.mapcols .mob-card{margin-bottom:0;min-width:0;overflow-wrap:anywhere}
.dropline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1px 0;font-size:12px}
.dropline span{min-width:0;overflow-wrap:anywhere}
.dropline b{white-space:nowrap;font-weight:600}
.dropline.ore b{color:#6cd3ff}
.mobentry{margin-bottom:2px;min-width:0}
.poollist{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0;min-width:0}
.poolitem{border:1px solid var(--edge2);border-radius:4px;padding:1px 5px;font-size:11px;background:rgba(0,0,0,.045);max-width:100%;overflow-wrap:anywhere}
.poolitem b{margin-left:4px;opacity:.75}
.map-node{background:#fffdf5;border:2px solid var(--edge);border-radius:6px;padding:4px 1px;text-align:center;cursor:pointer;font-size:12px;line-height:1.15}
.map-node small{display:block;font-size:10px;opacity:.75}.map-node:focus-visible{outline:3px solid #2f6fd6}
.map-node:hover{background:#ffe9a8}.map-node.active{background:#ffe08a;border-color:var(--gold)}.map-node.picked{outline:3px solid #2f6fd6}
.map-node.locked{opacity:.4;filter:grayscale(1)}.map-node.boss-node{border-color:#a23fd6}
.tree{display:flex;flex-direction:column;gap:6px}.trow{display:flex;align-items:center;gap:2px}.arw{font-size:9px;color:#8a6a2c}
.trunk{width:2px;height:10px;background:#8a6a2c;margin:-4px auto}
.tn{flex:1;min-width:0;text-align:center;border:2px solid var(--edge);border-radius:6px;padding:4px 2px;font-size:11px;background:#fffdf5;cursor:pointer;display:flex;flex-direction:column;line-height:1.2}
.tn.cur{background:#ffe08a;border-color:var(--gold);box-shadow:0 0 6px var(--gold)}.tn.ok{background:#dff5d8;border-color:#5cb85c}.tn.played{background:#dce8ff;border-color:#4a86e8}.tn.lock{opacity:.5;filter:grayscale(.7)}
.tn.pick{outline:3px solid #2f6fd6}.legend{display:flex;gap:4px;margin:8px 0;font-size:10px}.legend .tn{cursor:default;padding:2px}
@media(max-width:560px){.ib{width:32px;height:32px;font-size:16px}#dock{gap:3px;padding:4px 6px}.grid{grid-template-columns:repeat(5,1fr)}.skg{grid-template-columns:repeat(3,minmax(0,1fr))}.hair-preview-card{gap:8px;padding:6px}.hair-preview-stage{flex-basis:128px;width:128px;height:138px}.hair-preview-stage canvas{width:128px;height:138px}}
.atabs{display:flex;gap:4px;margin-bottom:14px;align-items:stretch}.atabs button{flex:1 1 0;min-width:0;height:34px;min-height:34px;padding:6px 8px;font-weight:bold;font-size:13px;line-height:20px;box-sizing:border-box}.atabs button.on{background:#ffe08a;border-color:var(--gold);height:34px;min-height:34px}
#qp{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:210px;background:rgba(30,20,10,.5);border:1px solid #ffffff44;border-radius:8px;padding:6px 8px;color:#fff;font:12px "Trebuchet MS",sans-serif;pointer-events:auto;z-index:5;line-height:1.3;display:none}#qp .pbar{margin:3px 0}
.skg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sk{position:relative;min-width:0;min-height:146px;border:1px solid var(--sk-accent,#8a6a2c);border-radius:10px;background:linear-gradient(160deg,#fffdf7,#f4e7c8);text-align:center;padding:7px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1;box-shadow:0 2px 5px #4b35151a,inset 0 1px 0 #fff}.sk:hover{transform:translateY(-1px);box-shadow:0 4px 9px #4b35152b}.sk.off{filter:grayscale(.45);opacity:.68}.sk.sel{outline:3px solid #2f6fd6;outline-offset:1px}.sk-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:2px}.sk-kind{font:700 8px/1.2 "Trebuchet MS",sans-serif;letter-spacing:.35px;padding:2px 4px;border-radius:7px;background:#3b2a1a12;color:#604723;white-space:nowrap}.sk-paused{font:700 8px/1.2 "Trebuchet MS",sans-serif;padding:2px 4px;border-radius:7px;background:#e5484d;color:#fff}.sk .si{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid #ffffffbb;background:radial-gradient(circle at 32% 25%,#fff 0,var(--sk-accent,#8a6a2c) 115%);font-size:24px;line-height:1;box-shadow:0 2px 5px #34200c33,inset 0 1px 0 #fff}.sk.auto-off .si{filter:grayscale(1);opacity:.55}.sk-name{width:100%;min-height:24px;font-size:10px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}.sk-level{font-size:10px;color:#5c482c;white-space:nowrap}.sk button{margin-top:auto;padding:2px 9px;font-weight:bold}.sk button:disabled{opacity:.36}.sk-autocast{display:flex;align-items:center;justify-content:center;gap:4px;min-height:14px;font-size:9px;line-height:1;white-space:nowrap;cursor:pointer;color:#4b3c21}.sk-autocast input{width:12px;height:12px;margin:0;accent-color:#2f6fd6;cursor:pointer}.sk.auto-off .sk-autocast{color:#8d3939}
.hair-preview-card{display:flex;align-items:center;gap:12px;margin:9px 0;padding:8px;border:1px solid var(--edge);border-radius:8px;background:linear-gradient(145deg,#fffdf6,#f0e2bd);box-shadow:inset 0 1px 0 #fff}.hair-preview-stage{position:relative;flex:0 0 150px;width:150px;height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #c9a35b;border-radius:8px;background:radial-gradient(circle at 50% 37%,#fff9df,#d9c18b)}.hair-preview-stage canvas{display:block;width:150px;height:160px;image-rendering:pixelated}.hair-preview-loading{position:absolute;font-size:10px;color:#5d4929;text-align:center}.hair-preview-info{display:flex;flex-direction:column;gap:5px;min-width:0}.hair-preview-info .eyebrow{font-weight:bold;font-size:9px;letter-spacing:.7px;color:#89672e}.hair-preview-info b{font-size:14px;overflow-wrap:anywhere}.hair-preview-info .hair-style-label{font-weight:bold;color:#63491f;font-size:12px}.hair-controls button{min-width:40px;font-weight:bold}.hair-controls span{font-weight:bold;font-size:12px}
.doll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:8px auto;padding:10px;border-radius:10px;background:radial-gradient(#ffe9a8,#e9d39a)}
#modal{position:fixed;inset:0;background:#0009;z-index:900;display:none;align-items:center;justify-content:center}
.bts{display:flex;align-items:center;gap:4px;flex:none}.bts small{width:34px;text-align:right}.bts button{width:42px;padding:3px 0;text-align:center}
.chip{background:#fffdf5;border:2px solid var(--edge2);border-radius:14px;padding:2px 10px;font-size:12px}

const SU=k=>k.toUpperCase(),BX_=13,Z0=-28,Z1=12,MPS=15,AGGRO=6.5,HPK=42,HPE=1.3,K5=['str','agi','dex','luk','int'];

function applyDot(o,dps,dur,col){if(!o||!(dur>0))return;(o.dots=o.dots||[]).push({dps,t:0,dur,col:col||'#7dff7d'})}
// A stunned mob neither advances nor swings: its attack timer simply stops counting down.
function applyStun(o,dur){if(!o||!(dur>0))return;
  const d=dur*(o.boss?.5:1);o.stun=Math.min(o.boss?1:2,Math.max(o.stun||0,d))}
// Chain bounces a share of the hit onto the nearest other mobs - the pack-clearing tool.
function chainHit(src,dmg,col,n){if(!src||!(dmg>0)||mobs.length<2)return;
  const near=mobs.filter(o=>o!==src&&o.hp>0&&o.pack===src.pack).sort((a,b)=>Math.hypot(a.x-src.x,a.z-src.z)-Math.hypot(b.x-src.x,b.z-src.z)).slice(0,n||2);
  for(const o of near){shots.push({x0:src.x,z0:src.z,x1:o.x,z1:o.z,t:0,col:col||'#fff'});hurt(o,Math.max(1,Math.round(dmg)),col)}}
const mkDrop=it=>({it,wx:mob.x+rnd(-.7,.7),wz:mob.z+rnd(-.7,.7),y:0,vy:-220,t:0});
const addFloat=(x,y,z,txt,col,big,kind='text')=>floats.push({x,y,z,txt,col,life:1,big,kind});
// Floating combat numbers are shortened by default: 100,000 reads "100K", 1,000,000 reads "1M".
// The Settings panel switches every damage float (normal, critical and incoming) to full digits.
// One decimal is kept only where it carries information (1.2M, 12.5K), and a K that rounds up
// to 1000 is promoted to M so the label never reads "1000K".
const shortNum=n=>{n=Math.round(Number(n)||0);const a=Math.abs(n),u=(v,s)=>{const r=Math.round(v*10)/10;return(Number.isInteger(r)?String(r):r.toFixed(1))+s};
  if(a>=1e9)return u(n/1e9,'B');
  if(a>=1e6)return u(n/1e6,'M');
  if(a>=1e3)return Math.abs(Math.round(n/100)/10)>=1000?u(n/1e6,'M'):u(n/1e3,'K');
  return String(n)};
const fullNum=()=>typeof S!=='undefined'&&S&&S.dmgShort===false;
// Two settings decide what a number looks like: 'Show damage numbers' (S.dmgShow) hides every
// combat float when it is off, and 'Short form' (S.dmgShort) switches between 100K/1M and the
// full digits. Reward floats (Zeny, EXP) follow the short/full style but are never hidden.
const numTxt=n=>fullNum()?String(Math.round(n)):shortNum(n);
const damageFloat=(x,y,z,amount,critical=false,incoming=false)=>{if(S&&S.dmgShow===false)return;addFloat(x,y,z,numTxt(amount),null,false,incoming?'incoming':critical?'critical':'damage')};
// Skill labels track the moving player, rather than floating away from the cast location.
const skillNameFloat=(name,slot=0)=>floats.push({x:pl.x,y:3.15+slot*.38,z:pl.z,txt:name,life:1.15,kind:'skill',anchor:'hero'});
function log(m,cls){logs.push({m,cls});if(logs.length>80)logs.shift();
  const f=$('feed'),d=document.createElement('div');d.textContent=m;f.appendChild(d);while(f.children.length>4)f.removeChild(f.firstChild);setTimeout(()=>d.remove(),7000);if(tabs.includes('log'))renderWin()}

// ---------- combat ----------
function shot(col){if(!mob||heroWeaponType(C().n,C().wt,S.eq.weapon&&S.eq.weapon.wt)!=='bow')return;
  shots.push({x0:pl.x,z0:pl.z,x1:mob.x,z1:mob.z,t:0,col:col||'#fff',arrow:true})}
function hurt(o,d,col,c){o.hp-=d;o.flash=1;damageFloat(o.x+rnd(-.4,.4),1.2+.8*(o.spriteScale||o.size),o.z,d,c);if(o.hp<=0)kill(o)}
function strike(mult,col,magic=false){
  if(!mob)return;if(Math.random()*100<missCh()){addFloat(mob.x,1.8,mob.z,'Miss','#ccc');return}
  const c=Math.random()*100<crit(),base=magic?matk():atk(),d=Math.max(1,Math.round(base*mult*rnd(Math.min(.95,.7+st('dex')*.004),1.15)*(c?critD():1)));
  mob.hp-=d;mob.flash=1;shake=c?6:2;damageFloat(mob.x+rnd(-.4,.4),1.5*Math.max(1,(mob.spriteScale||mob.size)*.8)+.6,mob.z,d,c);
}
// Higher job tiers get more casts per swing: Novice 1, first job 2, second job 3, transcendent
// 4 (tier is 0/1/2/3 - Assassin Cross and Lord Knight are tier 3, not 2). Every cast after the
// first lands softer (SKFADE), so the extra spam reads as pressure rather than as a flat
// doubling of single-target damage.
const SKSLOTS=t=>1+(t||0),SKFADE=[1,.55,.3,.18];
// dot.pow is the fraction of the triggering hit dealt PER SECOND, so a .05/4s dot adds 20% of
// the hit spread over time. chain.pow is the fraction each bounce deals, once per target.
function castSkill(sk,k){
  // Hold the target fixed for this cast: an AoE kill can advance activePack while we are
  // still iterating. The remaining effects must never spill into the next sleeping pack.
  const target=mob,base=sk.magic?matk():atk(),m=sk.mul(lv(sk.id))*(1+st('int')*.01)*k;
  playSkillFx(sk.id,target,sk.col);
  strike(m,sk.col,!!sk.magic);shot(sk.col,sk.rng);
  if(sk.aoe&&target)for(const o of mobs.slice())if(o!==target&&o.pack===target.pack&&Math.hypot(o.x-target.x,o.z-target.z)<4)hurt(o,Math.max(1,Math.round(base*m*.8)),sk.col);
  if(sk.chain&&target&&mobs.includes(target))chainHit(target,base*m*(sk.chain.pow||.5),sk.col,Math.min(4,(sk.chain.n||2)+Math.floor(lv(sk.id)/2)));
  if(sk.dot&&target&&target.hp>0)applyDot(target,base*m*(sk.dot.pow||.05),sk.dot.dur||4,sk.dot.col||sk.col);
  if(sk.stun&&target&&target.hp>0)applyStun(target,(sk.stun.dur||.8)*(1+lv(sk.id)*.08));
  if(target&&mobs.includes(target))for(let i=1;i<sk.hits;i++)pend.push({t:i*.09,m,col:sk.col,magic:!!sk.magic});
}
function playerAttack(){
  pAtkT=aspd();atkAnim=1;
  const far=mob&&Math.hypot(mob.x-pl.x,mob.z-pl.z)>(C().rng?3:1.2+.45*mob.size)+.6;
  const ready=SKILLS.filter(s=>s.type==='act'&&skillOn(s.id)&&(skCd[s.id]||0)<=0&&(!far||s.rng))
    .sort((a,b)=>b.mul(lv(b.id))*b.hits-a.mul(lv(a.id))*a.hits);
  const pack=mob&&mob.pack;let cast=0;
  for(const sk of ready){
    if(cast>=SKSLOTS(C().tier))break;
    const k=SKFADE[cast]||.3;cast++;
    skCd[sk.id]=sk.cd;skillNameFloat(sk.n,cast-1);
    castSkill(sk,k);
    if(!mob||mob.hp<=0||mob.pack!==pack)break;
  }
  if(cast||far)return;
  strike(1);shot();const d=pv('dbl');
  if(d&&Math.random()<d/100+st('dex')*.003){pend.push({t:.15,m:1,col:'#aef'});skillNameFloat('Double Attack')}
}
function addJob(x){const j=jobOf(),c=C();if(j.jl>=c.mj)return;j.jx+=x;
  while(j.jl<c.mj&&j.jx>=jneed(j.jl)){j.jx-=jneed(j.jl);j.jl++;log(`JOB LEVEL UP! ${S.cls} Job Lv ${j.jl} (+1 skill point)`,'r3');addFloat(pl.x,3.2,pl.z,'JOB UP!','#8fe9ff',true)}
  if(j.jl>=c.mj)j.jx=0}
function checkLevel(){while(S.lv<150&&S.exp>=need()){S.exp-=need();S.lv++;const p=3+Math.floor(S.lv/5);S.pts+=p;S.hp=maxHp();
  log(`LEVEL UP! Lv ${S.lv}. +${p} stat points`,'r4');addFloat(pl.x,3.6,pl.z,'LEVEL UP!','#fff',true)}
  qRefresh()}
const qProg=type=>S.q&&S.q.forEach(q=>{if(q.type===type)q.prog=Math.min(q.goal,q.prog+1)});
// A balance difference is not income: a purchase in the same frame can hide earned Zeny.
// Count each credit directly for the live hover rate, without persisting session history.
function earnZeny(amount){const n=Math.max(0,Number(amount)||0);S.zeny+=n;zenyEarned+=n}
function kill(o){const keep=mob;if(o)mob=o;if(!mob||!mobs.includes(mob)){mob=keep;return}
  const g=gx();S.kills++;S.kl++;qProg('kill');if(mob.boss)qProg('boss');
  const z=Math.round(mob.zeny*(1+pv('zeny')/100))*g,xp=Math.round(mob.exp*expRate());earnZeny(z);S.exp+=xp;addJob(Math.round(Math.round(mob.exp*.7)*expRate()));pend=[];
  addFloat(mob.x,2.4,mob.z,'+'+numTxt(z)+'z','#ffd23f');log(`${mob.n} defeated! +${xp.toLocaleString()} EXP, +${z.toLocaleString()} Zeny`);
  // Drop odds are the field's own numbers: nothing on the character scales them, so LUK cannot
  // bend the tables (it still raises ATK through the crit/DEX side of the stat sheet, which is
  // what it is for).
  for(const[T,ch]of mob.drops)if(Math.random()*100<ch)drops.push(mkDrop(genGear(T,mob.lvl,mob.sec,mob.boss,mob.tier)));
  if(Math.random()*100<mob.cardCh){const g2=mob.card.g;drops.push(mkDrop({card:1,id:uid(),n:mob.card.n,g:g2,stat:mob.card.stat,v:cardVal(g2,mob.card.stat)}))}
  if(mob.ore)for(const o of['ori','elu'])if(Math.random()<mob.oreCh)drops.push(mkDrop({ore:o,id:uid(),n:ORE[o]}));
  if(Math.random()*100<(mob.boss?5:.3)){const r=pickW(PW[Math.min(S.mp,9)]),c=PETS.filter(x=>x.r===r),sp=PETS.indexOf(c[ri(0,c.length-1)]);
    if(S.pets.length<40){S.pets.push({id:ri(1e6,9e6),sp,mut:0,eq:[0,0,0],skills:[],on:S.pets.filter(x=>x.on).length<3});log(`A ${RN[r]} pet followed you: ${PETS[sp].n}!`,'r'+RCL[r]);addFloat(mob.x,3,mob.z,'PET!','#ff9dff',true)}
    else{const z=Math.floor(EGG*(.3+r*.4));earnZeny(z);log(`A ${RN[r]} ${PETS[sp].n} appeared but your pet collection is full (+${z}z).`)}}
  checkLevel();
  if(mob.boss||(S.lvl<10&&S.kl>=MPS)){mobs=[];S.kl=0;if(S.lvl<10&&S.lvl>=S.prog[S.mp]){S.prog[S.mp]=S.lvl+1;log(`${fieldName()} cleared! Stage ${S.lvl+1} unlocked.`,'r3');if(S.adv&&S.lvl<10){S.lvl++}}}
  mobs=mobs.filter(x=>x!==mob);
  if(mobs.length&&!mobs.some(x=>x.pack===activePack))activePack=nearestPack();
  mob=packMob();respawn=.7;save();ui();
}
function collect(it){
  if(it.card){S.cards.push(it);log(`Got card: [${GRADE[it.g]}] ${cardTxt(it)}`,'r'+GI[it.g]);addFloat(pl.x,2.8,pl.z,'CARD!','#ffb020',true);ui();return}
  if(it.ore){S.ore[it.ore]++;log(`Got ${it.n}!`,'r4');addFloat(pl.x,2.8,pl.z,it.n+'!','#6cd3ff',true);ui();return}
  // The bag holds BAGMAX items. At capacity the loot is refused and stays where it fell, so a
  // long farm can never grow the save past the cap.
  if(S.inv.length>=BAGMAX){log(`Bag full (${BAGMAX} items): sold nothing, left ${it.name} on the ground.`,'r0');addFloat(pl.x,3,pl.z,'BAG FULL','#ff6b6b',true);ui();return}
  S.inv.push(it);qProg('loot');log(`Picked up [${RAR[it.tier].n}] ${it.name}`,'r'+it.tier);
  if(S.auto!==false&&canUse(it)){const cur=S.eq[ekey(it)];if(!cur||ev(it)>ev(cur))equip(it.id,true)}ui();
}
function equip(id,quiet){const i=S.inv.findIndex(x=>x.id===id);if(i<0)return;const it=S.inv[i];if(!canUse(it)){log(`Your class cannot use ${it.name}.`);return}
  S.inv.splice(i,1);const k=ekey(it),old=S.eq[k];if(old)S.inv.push(old);S.eq[k]=it;S.hp=Math.min(S.hp,maxHp());if(!quiet)log('Equipped '+iname(it));selB=null;ui();save()}
// Selling is pocket money, deliberately: it scales with the item's rarity band, its stage
// section and its level, but stays far below the Zeny a field actually pays - a Common starter
// piece sells for ~50z and the best Legendary Abyss gear for under 2,000z, so dumping a full
// bag never funds an upgrade. Pinned by gear_sim.js.
const sellVal=it=>Math.max(1,Math.round(50*(1+.9*(it.sec||0))*(1+1.4*(it.tier||0))*(1+.005*(it.lvl||0))));
function sell(id){const i=S.inv.findIndex(x=>String(x.id)===String(id));if(i<0)return;const it=S.inv.splice(i,1)[0];earnZeny(sellVal(it));(it.cards||[]).forEach(c=>S.cards.push(c));if(selB==it.id)selB=null;ui();save()}
// Quest goal AND reward are solved from the level you are standing at, by the one function the
// panel and the Claim button both read - so what the quest panel states is exactly what you are
// paid. The old code froze both at the level the quest was created, so a quest picked up at Lv 1
// could be handed in at Lv 90 for a Lv 1 pittance, and a save repaired at a different level could
// show one number and pay another. Every level-up and every map move re-solves the open quests
// (qRefresh), keeping the progress you have already made.
function qScale(q){const L=S?S.lv:1;
  const g=q.type==='kill'?12+L*2:q.type==='loot'?3+Math.floor(L/3):1+Math.floor(L/10);
  q.goal=Math.max(1,g);if(q.prog>q.goal)q.prog=q.goal;
  const m=S?gx():1,z0=S?zenAt(pw()):1;
  q.z=Math.max(1,Math.floor(q.goal*QZ[q.type]*z0*m));
  q.xp=Math.max(1,Math.floor(needAt(L)*QXP[q.type]*(S?expRate():1)));
  q.at=L;return q}
function newQuest(type){return qScale({type,goal:1,prog:0})}
function qRefresh(){if(!S||!Array.isArray(S.q))return;(S.q||[]).forEach(q=>{if(q&&q.type)qScale(q)})}
const qTxt=q=>q.type==='kill'?`Defeat ${q.goal} monsters`:q.type==='loot'?`Collect ${q.goal} equipment drops`:`Defeat ${q.goal} boss${q.goal>1?'es':''}`;
function refine(sl){const it=S.eq[sl];if(!it||(it.r||0)>=10)return;const o=it.slot==='weapon'?'ori':'elu',c=refCost(it);
  if(S.ore[o]<1){log(`You need 1 ${ORE[o]}. (2% drop from Stage 10 monsters, 5% from the boss)`);return}if(S.zeny<c){log('Not enough Zeny.');return}
  S.ore[o]--;S.zeny-=c;if(Math.random()*100<refCh(it)){it.r=(it.r||0)+1;log(`Refine success! ${iname(it)}`,'r3');addFloat(pl.x,3,pl.z,'Refine +'+it.r,'#ffd23f')}
  else{if(it.r>=5){it.r--;log(`Refine failed... dropped to +${it.r}.`,'r0')}else log('Refine failed.','r0');addFloat(pl.x,3,pl.z,'Failed','#ff6b6b')}ui();save()}

// ---------- class change ----------
// Changing job is a restart: a class's own levels are not kept, so loading it up again
// starts Job Lv 1 at your Base Lv; only leaving Novice refunds stats.
//
// Stepping aside, though, remembers what you left: S.base[class] holds the Base Lv, EXP,
// stat points, stats and worn gear you had when you left that class, so you can go back
// to it later and pick up where you stopped.  Job Lv and skills are per class already.
// Only the class you are leaving is stored; a new promotion keeps its allocated stats,
// and the Novice is a clean restart - 25 Base Lv, Job Lv 0, stats refunded, no memory.
function classRec(n){return (S.base&&S.base[n])||null}
function snapClass(){
  if(!S.cls)return;S.base=S.base||{};
  const eq={};for(const k in S.eq)eq[k]=S.eq[k]?S.eq[k].id:null;
  S.base[S.cls]={lv:S.lv,exp:S.exp,pts:S.pts,hp:S.hp,st:Object.assign({},S.st),eq}}
function equipRec(ids){                       // put the stored loadout back on, by id: never creates items
  const off=[];for(const k in S.eq){const it=S.eq[k];S.eq[k]=null;if(it)off.push(it)}
  if(off.length)S.inv.push(...off);
  for(const k in ids){const id=ids[k];if(id==null||!(k in S.eq))continue;
    const i=S.inv.findIndex(x=>x&&String(x.id)===String(id));if(i>=0)S.eq[k]=S.inv.splice(i,1)[0]}}
function freshBuild(){for(const k in S.st)S.st[k]=1;S.pts=totalPts()}
function clearClassSkills(n){for(const id in S.sk){const s=SKILLS.find(x=>x.id===id);if(id!=='aid'&&s&&s.cls.includes(n))delete S.sk[id]}}
function noviceRun(){                         // a real restart: 25 Base Lv, Job Lv 0, stats refunded
  S.jobs.Novice={jl:1,jx:0};clearClassSkills('Novice');
  if(S.lv>25){S.lv=25;S.exp=0}
  if(S.base)delete S.base.Novice;             // nothing carried out of a restart
  freshBuild()}
// A class you have PLAYED before is always one click away: its Base Lv, EXP, stats, points,
// job levels, skills and worn gear are all still on it (S.base[n]), so there is nothing to
// re-earn - you just step back into it. The Novice reset gate and the parent job-level gate
// only apply to a class you have never played.
function playedClass(n){return !!(S.base&&S.base[n])}
// Class collection (v17b nerf): +1% damage per TRANSCENDENT (tier-3) class played, and
// only once the rebirth grind starts (Base Lv 100+). Derived at runtime, so old saves get
// credit for free, and both counts are data-driven - classes added later join in
// automatically. Played = a tier-3 record in S.base, or being on one right now.
const playedClasses=()=>{const s=new Set();if(CLASSES[S.cls]&&CLASSES[S.cls].tier===3)s.add(S.cls);for(const k in(S.base||{}))if(S.base[k]&&typeof S.base[k]==='object'&&CLASSES[k]&&CLASSES[k].tier===3)s.add(k);return s.size};
const t3Total=()=>{let n=0;for(const k in CLASSES)if(CLASSES[k].tier===3)n++;return n};
const collDmg=()=>S.lv>=100?playedClasses():0;
function classBlock(n){
  if(n===S.cls)return'Current class';if(n==='Novice')return'';
  if(playedClass(n))return'';
  for(let x=n;CLASSES[x].par;x=CLASSES[x].par){const p=CLASSES[x].par,pj=S.jobs[p];if(!pj||pj.jl<CLASSES[x].rj)return`Needs ${p} Job Lv ${CLASSES[x].rj}`}
  if(S.cls!=='Novice'&&S.cls!==CLASSES[n].par)return'Reset to Novice first';return''}
function changeClass(n){if(classBlock(n))return;
  snapClass();                                 // remember the class we are stepping away from
  const from=S.cls;S.cls=n;jobOf();
  const rec=n==='Novice'?null:classRec(n);     // a class you left earlier picks up where it stopped
  if(rec){S.lv=rec.lv;S.exp=rec.exp;S.pts=rec.pts;S.st=Object.assign({},rec.st);equipRec(rec.eq)}
  else if(n==='Novice')noviceRun();
  else if(from==='Novice')freshBuild();       // promotions preserve allocated stats and unspent points
  {const o=S.eq.off;if(o&&!(o.slot==='off'?canShield():dualOk(o))){S.inv.push(o);S.eq.off=null}}const w=S.eq.weapon;
  if(w&&w.wt&&!C().wt.includes(w.wt)){S.inv.push(w);S.eq.weapon=null;log('Your weapon cannot be used by this class. Moved to Bag.')}
  S.hp=Math.max(1,Math.min(rec&&rec.hp||maxHp(),maxHp()));
  snapClass();                                 // so you can step away again right away
  log(rec?`Class: ${n} · back to Base Lv ${S.lv} · Job Lv ${S.jobs[n].jl} · stats, skills and gear restored.`
    :n==='Novice'?`Restarted as Novice · Base Lv ${S.lv} · job levels cleared · ${S.pts} stat points to spend.`
    :`Class: ${n} · Base Lv ${S.lv} · Job Lv 1 · ${from==='Novice'?'stats refunded':'stats retained'} · ${S.pts} stat points to spend.`,'r4');
  addFloat(pl.x,3.6,pl.z,n+'!','#fff',true);ui();save()}

// ---------- UI ----------
const TABS={map:['🗺️','World Map','M'],status:['📊','Character','S'],job:['🌳','Class Tree','J'],skills:['✨','Skills','K'],bag:['🎒','Inventory','B'],log:['📃','Log','L'],pet:['🐾','Pets','P'],set:['⚙️','Settings','O'],gm:['🛠️','GM Tools','G']};
const dot=k=>!S?false:k==='status'?S.pts>0:k==='skills'?skpAvail()>0:k==='quest'?!!(S.q&&S.q.some(q=>q.prog>=q.goal)):k==='cards'?S.cards.length>0:false;
const find=id=>[...S.inv,...items(),...S.cards].find(x=>String(x.id)===String(id));
const cell=(it,sel,extra='')=>`<div class="cell b${dtier(it)}${sel?' sel':''}" data-tip="${it.id}" ${extra}>${icon(it)}${it.r?`<i class="rf">+${it.r}</i>`:''}</div>`;
function itemMain(it){
  if(it.card)return`<b class="r${GI[it.g]}">${it.n}</b><div>${GRADE[it.g]} card &middot; <b>${SU(it.stat)} +${it.v}</b></div><div><small>Fits: ${CFL[CFIT[it.stat]]} only</small></div>`;
  return`<b class="r${it.tier}">${iname(it)}</b><div><small>${RAR[it.tier].n} ${SLOTS[it.slot].label}${it.wt?' ('+it.wt+')':''} &middot; ${SECN[it.sec||0]}</small></div>
  <div><b>${SLOTS[it.slot].stat} +${ev(it)}</b>${it.r?` <small>(base ${it.val})</small>`:''}</div>${(it.aff||[]).length?`<div class="sec">Affixes <small>(${it.aff.length} random)</small></div>`:''}${(it.aff||[]).map(a=>`<div class="r1">&#9670; ${affTxt(a)}</div>`).join('')}`}

  stats(){const c=C(),b=k=>bon(k)?` <small class="r1">+${bon(k)}</small>`:'';

// than treating 10 minutes of paused frames as one second of furious combat.

function stepHudRate(rate,user,kills,earned,now){

    rate={user,lastAt:now,lastSampleAt:now,lastKills:k,lastEarned:z,started:now,killsPerMin:0,zenyPerMin:0,killsEvents:[],events:[]};

    if(dz)rate.events.push({at:now,amount:dz});
    rate.lastKills=k;rate.lastEarned=z;rate.lastAt=now;
    if(now-rate.lastSampleAt>=HUD_RATE_REFRESH){
      while(rate.killsEvents.length&&rate.killsEvents[0].at<=now-HUD_RATE_WINDOW)rate.killsEvents.shift();
      while(rate.events.length&&rate.events[0].at<=now-HUD_RATE_WINDOW)rate.events.shift();
      const elapsed=Math.max(HUD_RATE_REFRESH,Math.min(HUD_RATE_WINDOW,now-rate.started));
      rate.killsPerMin=rate.killsEvents.reduce((sum,e)=>sum+e.amount,0)*HUD_RATE_WINDOW/elapsed;
      rate.zenyPerMin=rate.events.reduce((sum,e)=>sum+e.amount,0)*HUD_RATE_WINDOW/elapsed;
      rate.lastSampleAt+=HUD_RATE_REFRESH*Math.floor((now-rate.lastSampleAt)/HUD_RATE_REFRESH);
    }

}
