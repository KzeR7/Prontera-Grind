<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontera Grind</title>
<style>
:root{--ink:#3b2a1a;--panel:#fff8e6;--edge:#c9a35b;--edge2:#8a6a2c;--hp:#e5484d;--exp:#4aa3df;--gold:#e8a800}
*{box-sizing:border-box}
html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#2b3a55; font-family:"Trebuchet MS",Verdana,sans-serif; color:var(--ink); }

.win{background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--edge2),0 4px 0 2px var(--edge2)}
.title{font-weight:bold;background:linear-gradient(#f3d98b,#d9b25c);border-bottom:2px solid var(--edge2);padding:4px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#wrap{width:100vw;height:100vh;display:flex;flex-direction:column;border:none;border-radius:0;box-shadow:none}
#view{position:relative;flex:1;width:100%;line-height:0;touch-action:none;cursor:grab;overflow:hidden}
#view canvas{width:100% !important;height:100% !important;display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.fl{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.fl.big{font-size:24px}
#tag{position:absolute;transform:translate(-50%,-100%);text-align:center;color:#fff;font:bold 12px "Trebuchet MS",sans-serif;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;display:none}
#tag .bar{width:90px;height:8px;margin:2px auto 0}
#prog{position:absolute;left:12px;top:12px;background:#0008;color:#fff;font:bold 13px "Trebuchet MS",sans-serif;padding:6px 12px;border-radius:4px;border:1px solid #ffffff44;display:flex;align-items:center;gap:10px}
#hint{position:absolute;left:12px;top:52px;color:#fff;font:11px "Trebuchet MS",sans-serif;opacity:.8;text-shadow:0 0 3px #000}
#hud{display:flex;flex-wrap:wrap;gap:12px 20px;padding:8px 16px;font-size:14px;align-items:center;background:var(--panel);border-top:2px solid var(--edge2);z-index:10}
.bar{width:140px;height:14px;background:#5b4a35;border:1px solid #3b2a1a;border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%}
.body{padding:8px;font-size:13px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--edge);background:#fffdf5;margin-bottom:4px;border-radius:4px;min-height:36px}
.r0{color:#555}.r1{color:#2a9d3f}.r2{color:#2f6fd6}.r3{color:#a23fd6}.r4{color:#e07b00;font-weight:bold}
button{font:inherit;font-size:12px;background:linear-gradient(#fff,#efe0b8);border:1px solid var(--edge2);border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--ink)}
button:hover{background:#ffe9a8}button:focus-visible{outline:2px solid #2f6fd6}
.wide{grid-column:1/-1}small{opacity:.7}button:disabled{opacity:.4;cursor:default}
#feed{position:absolute;left:12px;bottom:76px;font-size:13px;line-height:1.4;pointer-events:none;max-width:50%}
#feed div{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;background:#3b2a1acc;padding:6px 10px;border-radius:14px;border:2px solid var(--edge)}
.ib{position:relative;width:42px;height:42px;font-size:20px;line-height:1;padding:0;background:linear-gradient(#fff8e6,#e9d39a);border:2px solid var(--edge2);border-radius:10px;transition:transform .12s}
.ib:hover{transform:translateY(-2px)}.ib.on{background:#ffe08a;transform:translateY(-4px)}
.ib .k{position:absolute;right:3px;bottom:0;font-size:8px;font-weight:bold;opacity:.7}
.ib .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;background:#e5484d;border:2px solid #fff;border-radius:50%}
#wnd{position:absolute;right:12px;top:12px;bottom:76px;width:min(420px,calc(100% - 24px));display:none;flex-direction:column;pointer-events:auto;overflow:hidden;z-index:20}
#wb{overflow:auto;flex:1}
.hd{font-weight:bold;margin-bottom:6px}.full{width:100%;margin-top:8px;padding:6px}
.pbar{height:8px;background:#5b4a35;border-radius:4px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:#4aa3df}


/* Login Modal Overlay */
#loginOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 999; display: flex; align-items: center; justify-content: center; }
.login-card { width: min(340px, 90vw); padding: 20px; background: var(--panel); border: 3px solid var(--edge); border-radius: 8px; box-shadow: 0 0 0 2px var(--edge2), 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
.login-card h2 { margin: 0 0 4px 0; font-size: 20px; color: var(--ink); }
.login-card p { font-size: 12px; margin-bottom: 16px; opacity: 0.8; }
.form-group { margin-bottom: 12px; text-align: left; }
.form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input { width: 100%; padding: 8px 10px; border: 1px solid var(--edge2); border-radius: 4px; background: #fffdf5; font: inherit; font-size: 13px; }
.login-btn { width: 100%; padding: 8px; font-weight: bold; font-size: 14px; margin-top: 6px; }
.login-err { color: #e5484d; font-size: 12px; margin-top: 8px; min-height: 16px; font-weight: bold; }
.login-footer { margin-top: 14px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.job-card { background: #fffdf5; border: 2px solid var(--edge); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.gm-badge { background: #e5484d; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; margin-left: 6px; }
.mob-card { background: #fffdf5; border: 1px solid var(--edge); border-radius: 6px; padding: 8px; margin-bottom: 8px; }

#tooltip{position:fixed;pointer-events:none;z-index:1000;display:none;width:230px;padding:10px;background:#1f1710f8;color:#fff;border:2px solid var(--edge);border-radius:6px;font-size:12px;box-shadow:0 4px 12px #0008}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{font-weight:bold;margin:10px 0 4px;border-bottom:1px solid var(--edge2)}
hr{border:0;border-top:1px dashed var(--edge);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:2px solid var(--edge2);border-radius:6px;background:#2b1f14;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;min-width:0}
.cell.empty{opacity:.35;cursor:default}.cell.sel{outline:3px solid #ffe08a}
.cell.b1{border-color:#5cb85c}.cell.b2{border-color:#4a86e8}.cell.b3{border-color:#b05ce0}.cell.b4{border-color:#ffb020;box-shadow:0 0 7px #ffb020}
.cell .rf{position:absolute;right:2px;bottom:0;font:bold 10px sans-serif;color:#ffe08a;font-style:normal;text-shadow:0 0 2px #000}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:5px;margin:4px 0}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:5px;margin:4px 0}
.mapcard{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 6px;text-align:left;line-height:1.2;border:2px solid var(--edge);background:#fffdf5;border-radius:6px;cursor:pointer;overflow:hidden}
.mapcard:hover{background:#ffe9a8}.mapcard b{font-size:11px;white-space:nowrap;text-overflow:ellipsis;max-width:100%;overflow:hidden}.mapcard small{font-size:9px;opacity:.7}
.mapcard.on{background:#ffe08a;border-color:var(--gold)}
.mapcard.here{box-shadow:inset 0 0 0 2px #2f6fd6}
.wp.wide{flex:2 2 900px;min-width:320px}
.mapband{padding:2px 0 6px}
.mapband.fields{position:sticky;top:-1px;z-index:2;background:var(--panel);padding-top:4px;border-top:1px solid var(--edge2)}
.mapband.fields .mapband-t{position:sticky;top:-1px;background:var(--panel)}
.mapband-t{display:flex;align-items:center;gap:6px;font-weight:bold;margin:2px 0 4px}
.mapband-t small{font-weight:normal;opacity:.75}
.mapband-t button.go{margin-left:auto;padding:5px 12px;font-weight:bold;white-space:nowrap}
.mapcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;align-items:stretch;margin-top:8px}
.mapcols .mob-card{margin-bottom:0;min-width:0}
.dropline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1px 0;font-size:12px}
.dropline span{min-width:0}
.dropline b{white-space:nowrap;font-weight:600}
.dropline.ore b{color:#6cd3ff}
.mobentry{margin-bottom:2px}
.poollist{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0}
.poolitem{border:1px solid var(--edge2);border-radius:4px;padding:1px 5px;font-size:11px;background:rgba(0,0,0,.045)}
.poolitem b{margin-left:4px;opacity:.75}
@media(max-width:900px){.mapband,.mapband.fields{position:static}.mapcols{grid-template-columns:1fr}}
.map-node{background:#fffdf5;border:2px solid var(--edge);border-radius:6px;padding:4px 1px;text-align:center;cursor:pointer;font-size:12px;line-height:1.15}
.map-node:hover{background:#ffe9a8}.map-node.active{background:#ffe08a;border-color:var(--gold)}.map-node.picked{outline:3px solid #2f6fd6}
.map-node.locked{opacity:.4;filter:grayscale(1)}.map-node.boss-node{border-color:#a23fd6}
.tree{display:flex;flex-direction:column;gap:6px}.trow{display:flex;align-items:center;gap:2px}.arw{font-size:9px;color:#8a6a2c}
.trunk{width:2px;height:10px;background:#8a6a2c;margin:-4px auto}
.tn{flex:1;min-width:0;text-align:center;border:2px solid var(--edge);border-radius:6px;padding:4px 2px;font-size:11px;background:#fffdf5;cursor:pointer;display:flex;flex-direction:column;line-height:1.2}
.tn.cur{background:#ffe08a;border-color:var(--gold);box-shadow:0 0 6px var(--gold)}.tn.ok{background:#dff5d8;border-color:#5cb85c}.tn.played{background:#dce8ff;border-color:#4a86e8}.tn.lock{opacity:.5;filter:grayscale(.7)}
.tn.pick{outline:3px solid #2f6fd6}.legend{display:flex;gap:4px;margin:8px 0;font-size:10px}.legend .tn{cursor:default;padding:2px}
@media(max-width:560px){.ib{width:32px;height:32px;font-size:16px}#dock{gap:3px;padding:4px 6px}.grid{grid-template-columns:repeat(5,1fr)}}
.atabs{display:flex;gap:4px;margin-bottom:14px;align-items:stretch}.atabs button{flex:1 1 0;min-width:0;height:34px;min-height:34px;padding:6px 8px;font-weight:bold;font-size:13px;line-height:20px;box-sizing:border-box}.atabs button.on{background:#ffe08a;border-color:var(--gold);height:34px;min-height:34px}
#qp{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:210px;background:rgba(30,20,10,.5);border:1px solid #ffffff44;border-radius:8px;padding:6px 8px;color:#fff;font:12px "Trebuchet MS",sans-serif;pointer-events:auto;z-index:5;line-height:1.3;display:none}#qp .pbar{margin:3px 0}
.skg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sk{border:2px solid;border-radius:6px;background:#fffdf5;text-align:center;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}.sk.off{opacity:.55}.sk.sel{outline:3px solid #2f6fd6}.sk .si{font-size:22px}.sk small{font-size:10px;min-height:22px}.sk button{padding:0 8px}
.doll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:8px auto;padding:10px;border-radius:10px;background:radial-gradient(#ffe9a8,#e9d39a)}
#modal{position:fixed;inset:0;background:#0009;z-index:900;display:none;align-items:center;justify-content:center}
.bts{display:flex;align-items:center;gap:4px;flex:none}.bts small{width:34px;text-align:right}.bts button{width:42px;padding:3px 0;text-align:center}
.chip{background:#fffdf5;border:2px solid var(--edge2);border-radius:14px;padding:2px 10px;font-size:12px}
.trow .tn{font-size:10px;padding:3px 1px;word-break:break-word}.trow{gap:3px}.trunk{height:12px}
.cell{background:#e9dcb8;border-width:3px;text-shadow:0 1px 2px #0005}.cell.empty{background:#d5c79f}
.cell.b0{background:#eceae4;border-color:#8c8c8c}.cell.b1{background:#c9f2c9;border-color:#2e9e3e}.cell.b2{background:#c6dcff;border-color:#2f6fd6}.cell.b3{background:#e6c9ff;border-color:#9a3ae0}.cell.b4{background:#ffe3a0;border-color:#ff9a00;box-shadow:0 0 8px #ff9a00}
.cell .rf{color:#fff;background:#000b;padding:0 3px;border-radius:3px;text-shadow:none}
#qp{top:12px;transform:none}
#wins{position:absolute;right:12px;top:12px;bottom:76px;display:none;flex-direction:row-reverse;gap:8px;max-width:calc(100% - 24px);pointer-events:none;z-index:20}
.wp{pointer-events:auto;flex:0 1 380px;min-width:250px;display:flex;flex-direction:column;overflow:hidden}.wbody{overflow:auto;flex:1;scrollbar-gutter:stable}
.gt button{padding:2px 6px}.gt button.on{background:#ffe08a;border-color:var(--gold)}
.chooser{border:2px solid #2f6fd6;box-shadow:0 0 0 2px #2f6fd655}
.chooser>.hd{display:flex;align-items:center;gap:6px}
.chooser>.hd button.x{margin-left:auto;padding:0 7px}
.chooser .slot{background:#fff7dd}
.chooser .slot .cell{cursor:default}
.roll-status{height:30px;min-height:30px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.roll-status span{display:block;width:150px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="loginOverlay"><div class="login-card"><h2>⚔️ Prontera Grind</h2>
<div class="atabs"><button type="button" id="tabLogin" class="on">Login</button><button type="button" id="tabReg">Register</button></div>
<form id="loginForm" autocomplete="on">
<div class="form-group"><label for="username">Account Name</label><input type="text" id="username" required autocomplete="username"></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
<div class="form-group" id="regRow" style="display:none"><label for="password2">Confirm Password</label><input type="password" id="password2" autocomplete="new-password"></div>
<button type="submit" id="authBtn" class="login-btn">Login</button><div id="loginErr" class="login-err"></div></form>
<small>You must log in every time you open the game.</small>
<div id="buildTag" style="margin-top:6px;font-size:10px;opacity:.55;text-align:center"></div></div></div>
<div id="wrap"><div class="title"><span id="stageTitle">Prontera Lv 1</span><span id="grindStatus" style="font-size:12px;opacity:.85"></span></div>
<div id="view"><div id="ov"><div id="prog"></div><div id="tag"><b id="tn"></b><div class="bar"><i id="th" style="background:var(--hp)"></i></div></div><div id="hint">Drag to rotate &middot; Scroll to zoom</div><div id="feed"></div><div id="qp"></div><div id="dock"></div>
<div id="wins"></div></div></div>
<div id="hud"><div><b id="cls2"></b> Lv <b id="lv">1</b> / Job <b id="jl">1</b></div><div>HP <div class="bar"><i id="hpb" style="background:var(--hp)"></i></div></div>
<div>JOB <div class="bar"><i id="jb" style="background:#7a5ce0"></i></div></div><div>EXP <div class="bar"><i id="xpb" style="background:var(--exp)"></i></div></div>
<div style="color:var(--gold)">&#9679; <b id="zeny">0</b> Zeny</div><div>Kills <b id="kills">0</b></div>
<div style="margin-left:auto;display:flex;align-items:center;gap:8px"><span id="userBadge" style="font-weight:bold;font-size:12px;background:#e9d39a;padding:3px 8px;border-radius:4px;border:1px solid var(--edge2)"></span><button id="logoutBtn" onclick="logout()" style="display:none">Logout</button><button id="spd">Speed x1</button></div></div></div>
<div id="modal"><div class="login-card"><p id="mt" style="font-size:14px;opacity:1;margin:0 0 12px"></p><div class="row" style="justify-content:center"><button id="my">Yes</button><button id="mn">Cancel</button></div></div></div><div id="tooltip"></div>
<script src="assets/sprite_pack_data.js?v=1"></script>
<script src="assets/kit/morocc-atlas.js?v=1"></script>

<script>
const $=id=>document.getElementById(id);
const RAR=[{n:'Common',m:1,w:60},{n:'Fine',m:1.35,w:25},{n:'Rare',m:1.9,w:10},{n:'Epic',m:2.8,w:4},{n:'Legendary',m:4.5,w:1}];
const AM=[1,1.6,2.6,4,6.5],GRADE=['Common','Uncommon','Rare','Legendary'],GI=[0,1,2,4],CV=[1,2,3,5];
const SLOTS={weapon:{label:'Weapon',stat:'ATK',ic:'⚔️'},armor:{label:'Armor',stat:'DEF',ic:'🥼'},head:{label:'Headgear',stat:'HP',ic:'🎩'},off:{label:'Shield',stat:'DEF',ic:'🛡️'},leg:{label:'Legwear',stat:'DEF',ic:'👖'},acc:{label:'Accessory',stat:'HP',ic:'💍'}};
const WICON={dagger:'🗡️',katar:'🔪',staff:'🪄',bow:'🏹',axe:'🪓',sword:'⚔️',mace:'🔨'},ORE={ori:'Oridecon',elu:'Elunium'},SECN=['Novice gear','1st-job gear','2nd-job gear','High-tier gear'];
const STATS=[['str','STR','ATK'],['agi','AGI','ASPD, Flee'],['int','INT','Skill dmg'],['dex','DEX','Hit, min dmg'],['vit','VIT','DEF, MDEF, HP'],['luk','LUK','Crit, drops']];
const AFF=['str','agi','dex','luk','int','hp','atk','crit','aspd','flee','cdm'],AB={str:1,agi:1,dex:1,luk:1,int:1,hp:12,atk:.8,crit:.45,aspd:.6,flee:.8,cdm:1.5};

// The field is a vertical avenue: the player starts at the near end (high Z, bottom of the
// screen) and mobs hold the far end (low Z, top of the screen), so you run up to engage.
// AGGRO is how close you must get before a pack leaves its spawn to meet you; bosses ignore it.
// Mob HP is HPK*mb*pw^HPE where pw is the map's recommended level plus the field level.
// The old exponent 1.85 grew far faster than player ATK (which is roughly linear in level
// once stats cap), so a correctly-levelled character needed ~30-100s per mob from Geffen
// onward. 1.3 keeps HP just ahead of ATK: early maps fall in a couple of swings and the
// late maps in about five, with bosses still a ~12x fight. See tools/tests/economy_sim.js.
const SU=k=>k.toUpperCase(),BX_=5.5,Z0=-14,Z1=3,MPS=15,AGGRO=8.5,HPK=42,HPE=1.3,K5=['str','agi','dex','luk','int'];
const GM_USER='GM',GM_PASS='gm1234';   // CHANGE THE GM PASSWORD before you publish
const BUILD='2026-10-03 kit-v18 all-ten-maps skin-purge';   // shown on the login card - confirms which file you loaded
$('buildTag').textContent='build '+BUILD;

// ---------- class tree: Novice -> 6 first jobs -> 6 second jobs -> 6 third jobs ----------

['Swordman','Novice',.95,1.2,1.3,'b83b3b','8a2b2b',['sword'],'str',0],['Mage','Novice',1.1,1.3,.8,'3b6fb5','',['staff'],'int',1,'3b4fb5'],
['Archer','Novice',.85,1.15,.9,'2e7d32','1b4d1e',['bow'],'dex',1],['Thief','Novice',.8,1.1,.95,'4a7c3a','2e7d32',['dagger'],'agi',0],
['Acolyte','Novice',1,1.05,1.05,'e0c870','a08830',['mace'],'int',0],['Merchant','Novice',.9,1.2,1.2,'d08030','905010',['axe','mace'],'str',0],
['Knight','Swordman',.85,1.5,1.5,'801010','500000',['sword'],'str',0],['Wizard','Mage',1,1.8,.85,'153075','',['staff'],'int',1,'1f2f70'],
['Hunter','Archer',.7,1.4,.95,'105015','003005',['bow'],'dex',1],['Assassin','Thief',.62,1.45,1,'2c2c3c','1b1b28',['dagger','katar'],'agi',0],
['Priest','Acolyte',.9,1.3,1.1,'b09020','705000',['mace'],'int',0],['Blacksmith','Merchant',.8,1.6,1.4,'a05000','602000',['axe','mace'],'str',0],
['Lord Knight','Knight',.72,1.95,1.8,'600808','300000',['sword'],'str',0],['High Wizard','Wizard',.9,2.4,1,'0a1a55','',['staff'],'int',1,'0a1040'],
['Sniper','Hunter',.55,1.85,1.05,'0a3a0a','002000',['bow'],'dex',1],['Assassin Cross','Assassin',.5,1.9,1.15,'1a1a28','0a0a14',['dagger','katar'],'agi',0],

// ~2 h to the SECOND job change (Base Lv ~49), ~2 days to the transcendent line
// (Base Lv ~99), and Base 100-150 is a fresh ~3-day climb after a one-time "rebirth"
// drop in the requirement at level 100 - fast progress at the bottom, the grind lives
// at the top. exp = EXPK*pw^1.5/50, zeny = ri(ZK)*pw^2/1000, where
// pw = the field's power level (MAPS[mp].b + lvl, max 99). A boss replaces the pack
// every 16th kill (MPS), so the effective per-kill EXP is ~1.46x the mob figure.
// Quest EXP is a fraction of need(Lv) so it scales with the level instead of drifting.
// tools/tune_pacing.js solves the curve below against these anchors with the same model
// the economy tests use (~800 kills/hour, camping the band map's boss field); if real
// playtest kills/hour differ, re-run it rather than guessing at EXPK.
const EXPK=5.5,BOSEK=46,ZK=[8,14],BZK=[150,250];
// The v11 quest fractions (1/32, 1/40, 1/19) scaled by 4/15: on the steep v16 curve
// quests must never carry more than ~40% of a level, or the high levels would play as
// quest errands instead of a grind.

// ---------- class change ----------
// Changing job is a restart: a class's own levels are not kept, so loading it up again
// starts it over (Base Lv as you are now, Job Lv 1, stats refunded).
//
// Stepping aside, though, remembers what you left: S.base[class] holds the Base Lv, EXP,
// stat points, stats and worn gear you had when you left that class, so you can go back
// to it later and pick up where you stopped.  Job Lv and skills are per class already.
// Only the class you are leaving is stored; a class you have not played yet starts fresh,
// and the Novice is a clean restart - 25 Base Lv, Job Lv 0, stats refunded, no memory.
function classRec(n){return (S.base&&S.base[n])||null}
function snapClass(){
  if(!S.cls)return;S.base=S.base||{};
  const eq={};for(const k in S.eq)eq[k]=S.eq[k]?S.eq[k].id:null;
  S.base[S.cls]={lv:S.lv,exp:S.exp,pts:S.pts,hp:S.hp,st:Object.assign({},S.st),eq}}
function equipRec(ids){                       // put the stored loadout back on, by id: never creates items
  const off=[];for(const k in S.eq){const it=S.eq[k];S.eq[k]=null;if(it)off.push(it)}
  if(off.length)S.inv.push(...off);
  for(const k in ids){const id=ids[k];if(id==null||!(k in S.eq))continue;
    const i=S.inv.findIndex(x=>x&&String(x.id)===String(id));if(i>=0)S.eq[k]=S.inv.splice(i,1)[0]}}
function freshBuild(){for(const k in S.st)S.st[k]=1;S.pts=totalPts()}
function clearClassSkills(n){for(const id in S.sk){const s=SKILLS.find(x=>x.id===id);if(id!=='aid'&&s&&s.cls.includes(n))delete S.sk[id]}}
function noviceRun(){                         // a real restart: 25 Base Lv, Job Lv 0, stats refunded
  S.jobs.Novice={jl:1,jx:0};clearClassSkills('Novice');
  if(S.lv>25){S.lv=25;S.exp=0}
  if(S.base)delete S.base.Novice;             // nothing carried out of a restart
  freshBuild()}
// A class you have PLAYED before is always one click away: its Base Lv, EXP, stats, points,
// job levels, skills and worn gear are all still on it (S.base[n]), so there is nothing to
// re-earn - you just step back into it. The Novice reset gate and the parent job-level gate
// only apply to a class you have never played.
function playedClass(n){return !!(S.base&&S.base[n])}
// Class collection (v17b nerf): +1% damage per TRANSCENDENT (tier-3) class played, and
// only once the rebirth grind starts (Base Lv 100+). Derived at runtime, so old saves get
// credit for free, and both counts are data-driven - classes added later join in
// automatically. Played = a tier-3 record in S.base, or being on one right now.
const playedClasses=()=>{const s=new Set();if(CLASSES[S.cls]&&CLASSES[S.cls].tier===3)s.add(S.cls);for(const k in(S.base||{}))if(S.base[k]&&typeof S.base[k]==='object'&&CLASSES[k]&&CLASSES[k].tier===3)s.add(k);return s.size};
const t3Total=()=>{let n=0;for(const k in CLASSES)if(CLASSES[k].tier===3)n++;return n};
const collDmg=()=>S.lv>=100?playedClasses():0;
function classBlock(n){
  if(n===S.cls)return'Current class';if(n==='Novice')return'';
  if(playedClass(n))return'';
  for(let x=n;CLASSES[x].par;x=CLASSES[x].par){const p=CLASSES[x].par,pj=S.jobs[p];if(!pj||pj.jl<CLASSES[x].rj)return`Needs ${p} Job Lv ${CLASSES[x].rj}`}
  if(S.cls!=='Novice'&&S.cls!==CLASSES[n].par)return'Reset to Novice first';return''}
function changeClass(n){if(classBlock(n))return;
  snapClass();                                 // remember the class we are stepping away from
  S.cls=n;jobOf();
  const rec=n==='Novice'?null:classRec(n);     // a class you left earlier picks up where it stopped
  if(rec){S.lv=rec.lv;S.exp=rec.exp;S.pts=rec.pts;S.st=Object.assign({},rec.st);equipRec(rec.eq)}
  else if(n==='Novice')noviceRun();
  else freshBuild();                           // never played this one: new build at your level
  {const o=S.eq.off;if(o&&!(o.slot==='off'?canShield():dualOk(o))){S.inv.push(o);S.eq.off=null}}const w=S.eq.weapon;
  if(w&&w.wt&&!C().wt.includes(w.wt)){S.inv.push(w);S.eq.weapon=null;log('Your weapon cannot be used by this class. Moved to Bag.')}
  S.hp=Math.max(1,Math.min(rec&&rec.hp||maxHp(),maxHp()));
  snapClass();                                 // so you can step away again right away
  log(rec?`Class: ${n} · back to Base Lv ${S.lv} · Job Lv ${S.jobs[n].jl} · stats, skills and gear restored.`
    :n==='Novice'?`Restarted as Novice · Base Lv ${S.lv} · job levels cleared · ${S.pts} stat points to spend.`
    :`Class: ${n} · Base Lv ${S.lv} · Job Lv 1 · ${S.pts} stat points to spend.`,'r4');
  addFloat(pl.x,3.6,pl.z,n+'!','#fff',true);ui();save()}

  if(kind===2&&fr>=2&&fr<=5){const s=pr(16,22,10);parts.push({x:s[0],y:s[1],z:s[2]+8,rx:10,ry:4,col:'rgba(255,230,160,.8)'})}

const sheetCache=new Map();

const P=new THREE.Group();scene.add(P);mkShadow(P,.4);
let heroSpr=null,heroHeadSpr=null,heroKey='',heroDirty=false;
// ----- Class sprite packs (assets/sprite_pack_data.js, built by tools/make_sprite_pack.py) -----
// Body + head are composited once per (class, sex, hair) into a single atlas: 8 cols = frames, rows = anim*8+dir (idle,walk,attack x 8 dirs)

const PACK_BODY={Novice:'novice',
  Swordman:'swordman',Knight:'swordman','Lord Knight':'swordman',
  Mage:'mage',Wizard:'mage','High Wizard':'mage',

  Merchant:'blacksmith',Blacksmith:'blacksmith',Whitesmith:'blacksmith'};
// A class uses its own art as soon as the pack has a body named after it

// Until then it keeps its first-job line's art, so every class always has a sprite.
const packBodyName=c=>String(c||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
function packBodyFor(cls,tier){const PK=window.SPRITE_PACK;if(!PK)return null;

const packImg={},packCache=new Map(),PACK_K=.03;let packReady=false;
(function(){const PK=window.SPRITE_PACK;if(!PK)return;let n=0,tot=0;
  const ld=(k,u)=>{tot++;const i=new Image();i.onload=()=>{if(++n===tot){packReady=true;heroKey=''}};i.src=u;packImg[k]=i};
  for(const c in PK.bodies)ld('b:'+c,PK.bodies[c].atlas);for(const h in PK.heads)ld('h:'+h,PK.heads[h])})();
function packTex(opt){
  const PK=window.SPRITE_PACK,body=packBodyFor(opt.cls,opt.tier)||'thief',sex=opt.sex==='f'?'female':'male',hs=(((opt.hair|0)%PK.hairStyles)+PK.hairStyles)%PK.hairStyles,key=body+'|'+sex+'|'+hs;

    const dx=f*PK.cellW+PK.padL,dy=(a*8+d)*PK.cellH+PK.padT;
    g.drawImage(bi,f*96,(a*8+d)*96,96,96,dx,dy,96,96);
    const an=anc[a][d][f];g.drawImage(hi,d*64,hs*64,64,64,dx+an[0]-32,dy+an[1]-48,64,64)}
  const t=new THREE.CanvasTexture(cv);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;packCache.set(key,t);return t}
function mkPackHero(opt){
  const PK=window.SPRITE_PACK,t=packTex(opt).clone();t.needsUpdate=true;t.repeat.set(1/8,1/24);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,alphaTest:.12}));
  s.center.set(PK.pivotX/PK.cellW,(PK.cellH-PK.pivotY)/PK.cellH);s.scale.set(PK.cellW*PACK_K,PK.cellH*PACK_K,1);s.userData.pack=1;return s}
function setPackCell(spr,dir,run,atk,clock){
  let a=0,f=0;if(atk>0){a=2;f=Math.min(5,Math.floor((1-atk)*6))}else if(run){a=1;f=Math.floor(clock*10)%8}

function ensureHero(opt){const k=JSON.stringify(opt);if(heroKey===k&&heroSpr)return;heroKey=k;heroDirty=false;
  if(heroSpr){P.remove(heroSpr);heroSpr=null}if(heroHeadSpr){P.remove(heroHeadSpr);heroHeadSpr=null}
  const pb=packReady?packBodyFor(opt.cls,opt.tier):null;
  if(pb&&packImg['b:'+pb]){heroSpr=mkPackHero(opt);P.add(heroSpr);return}
  // the class pack is the only hero art; until it loads (or if a body is missing) the
  // drawn hero keeps the game playable
  const tex=getSheet('h:'+k,(ctx,x,y,d,kind,fr)=>drawHero(ctx,x,y,d,kind,fr,opt));
  heroSpr=mkBillboard(tex,1.95,2.92);P.add(heroSpr)}
function buildMob(m){
  const G=new THREE.Group();

let slashM=null;
function drawSlashFX(x,z){
  if(!slashM){const cv=document.createElement('canvas');cv.width=80;cv.height=80;const g=cv.getContext('2d');
    g.strokeStyle='#fff6c8';g.lineWidth=7;g.beginPath();g.arc(40,48,28,-1.4,.9);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(40,48,24,-1.25,.7);g.stroke();

const mobMesh=new Map(),petMesh=new Map();let curMob=null,mobG=null,mobMats=[],lastBoss=null,dmesh=new Map(),tmp=new THREE.Vector3(),lastProg='';
function scr(x,y,z){tmp.set(x,y,z).project(cam);return[(tmp.x+1)/2*R.domElement.clientWidth,(1-tmp.y)/2*R.domElement.clientHeight]}

const ct=new THREE.Vector3(0,.8,0);let lastKey='';
function draw(){

    v.G.scale.set(s,s,s);v.G.position.set(m.x,0,m.z);

  const pids=new Set(S.pets.filter(p=>p.on).map(p=>p.id));petMesh.forEach((v,id)=>{if(!pids.has(id)){scene.remove(v.G);petMesh.delete(id)}});
  S.pets.filter(p=>p.on).forEach(p=>{const sp=PETS[p.sp],r=petR[p.id];if(!r)return;let v=petMesh.get(p.id);
    if(!v){const tex=getSheet('p:'+sp.n+':'+sp.c,(ctx,x,y,d,kind,fr)=>drawCritter(ctx,x,y,d,kind,fr,sp.n==='Lunatic'?'bunny':sp.n.includes('Wolf')?'cat':sp.n.includes('Peco')?'bug':sp.n.includes('Dragon')||sp.n.includes('Baphomet')?'demon':'blob',sp.c));
      v={G:new THREE.Group(),spr:mkBillboard(tex,1.35,2)};v.G.add(v.spr);mkShadow(v.G,.28);scene.add(v.G);petMesh.set(p.id,v)}
    v.G.position.set(r.x,0,r.z);v.G.scale.setScalar(.7+sp.r*.12);
    const pf=mob?Math.atan2(mob.z-r.z,mob.x-r.x):pFace;
    setCell(v.spr,viewDir(pf),animRow(r.run,r.lunge||0,t,12));
    if(p.mut)v.spr.material.color.set(MC[p.mut]);else v.spr.material.color.set(0xffffff)});
  const live=new Set();

    if(!m){const i=d.it,sl=i.card?'card':i.ore?'ore':i.slot,col=i.ore?(i.ore==='ori'?0xff9d3c:0x6cd3ff):TC[dtier(i)];
      m=mk(scene,sl==='weapon'?BX(.14,.75,.14):sl==='armor'?BX(.45,.45,.25):sl==='card'?BX(.3,.42,.04):sl==='ore'?new THREE.OctahedronGeometry(.22):SP(.24),col);

  cam.position.set(ct.x+Math.sin(az)*Math.cos(el)*dd+rnd(-sk,sk),Math.sin(el)*dd+.5,ct.z+Math.cos(az)*Math.cos(el)*dd+rnd(-sk,sk));
  cam.lookAt(ct);R.render(scene,cam);
  floats.forEach(f=>{if(!f.el){const e=document.createElement('div');e.className='fl'+(f.big?' big':'');e.textContent=f.txt;e.style.color=f.col;ov.appendChild(e);f.el=e}
    const[a,b]=scr(f.x,f.y,f.z);f.el.style.left=a+'px';f.el.style.top=b+'px';f.el.style.opacity=Math.max(0,f.life)});
  const pt=bn?'BOSS FIGHT':`Monsters ${Math.min(S.kl,MPS)}/${MPS}${isBoss()?' → Boss':''}`;if(pt!==lastProg){lastProg=pt;prog.textContent=pt}
}
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;try{for(let i=0;i<speed;i++){update(dt);kitTick(dt)}draw()}catch(e){if(!loop.e){loop.e=1;console.error(e);log('Error: '+e.message,'r0')}}requestAnimationFrame(loop)}
