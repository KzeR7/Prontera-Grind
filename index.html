<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prontera Grind</title>
<style>
:root{--ink:#3b2a1a;--panel:#fff8e6;--edge:#c9a35b;--edge2:#8a6a2c;--hp:#e5484d;--exp:#4aa3df;--gold:#e8a800}
*{box-sizing:border-box}
html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#2b3a55; font-family:"Trebuchet MS",Verdana,sans-serif; color:var(--ink); }

.win{background:var(--panel);border:3px solid var(--edge);border-radius:6px;box-shadow:0 0 0 2px var(--edge2),0 4px 0 2px var(--edge2)}
.title{font-weight:bold;background:linear-gradient(#f3d98b,#d9b25c);border-bottom:2px solid var(--edge2);padding:4px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#wrap{width:100vw;height:100vh;display:flex;flex-direction:column;border:none;border-radius:0;box-shadow:none}
#view{position:relative;flex:1;width:100%;line-height:0;touch-action:none;cursor:grab;overflow:hidden}
#view canvas{width:100% !important;height:100% !important;display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.fl{position:absolute;transform:translate(-50%,-50%);font-weight:bold;font-size:16px;white-space:nowrap;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.fl.big{font-size:24px}
#tag{position:absolute;transform:translate(-50%,-100%);text-align:center;color:#fff;font:bold 12px "Trebuchet MS",sans-serif;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;display:none}
#tag .bar{width:90px;height:8px;margin:2px auto 0}
#prog{position:absolute;left:12px;top:12px;background:#0008;color:#fff;font:bold 13px "Trebuchet MS",sans-serif;padding:6px 12px;border-radius:4px;border:1px solid #ffffff44;display:flex;align-items:center;gap:10px}
#hint{position:absolute;left:12px;top:52px;color:#fff;font:11px "Trebuchet MS",sans-serif;opacity:.8;text-shadow:0 0 3px #000}
#hud{display:flex;flex-wrap:wrap;gap:12px 20px;padding:8px 16px;font-size:14px;align-items:center;background:var(--panel);border-top:2px solid var(--edge2);z-index:10}
.bar{width:140px;height:14px;background:#5b4a35;border:1px solid #3b2a1a;border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%}
.body{padding:8px;font-size:13px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--edge);background:#fffdf5;margin-bottom:4px;border-radius:4px;min-height:36px}
.r0{color:#555}.r1{color:#2a9d3f}.r2{color:#2f6fd6}.r3{color:#a23fd6}.r4{color:#e07b00;font-weight:bold}
button{font:inherit;font-size:12px;background:linear-gradient(#fff,#efe0b8);border:1px solid var(--edge2);border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--ink)}
button:hover{background:#ffe9a8}button:focus-visible{outline:2px solid #2f6fd6}
.wide{grid-column:1/-1}small{opacity:.7}button:disabled{opacity:.4;cursor:default}
#feed{position:absolute;left:12px;bottom:76px;font-size:13px;line-height:1.4;pointer-events:none;max-width:50%}
#feed div{color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
#dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:#3b2a1acc;padding:6px 10px;border-radius:14px;border:2px solid var(--edge)}
.ib{position:relative;width:46px;height:46px;font-size:22px;line-height:1;padding:0;background:linear-gradient(#fff8e6,#e9d39a);border:2px solid var(--edge2);border-radius:10px;transition:transform .12s}
.ib:hover{transform:translateY(-2px)}.ib.on{background:#ffe08a;transform:translateY(-4px)}
.ib .k{position:absolute;right:3px;bottom:0;font-size:9px;font-weight:bold;opacity:.7}
.ib .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;background:#e5484d;border:2px solid #fff;border-radius:50%}
#wnd{position:absolute;right:12px;top:12px;bottom:76px;width:min(380px,calc(100% - 24px));display:none;flex-direction:column;pointer-events:auto;overflow:hidden;z-index:20}
#wb{overflow:auto;flex:1}
.hd{font-weight:bold;margin-bottom:6px}.full{width:100%;margin-top:8px;padding:6px}
.pbar{height:8px;background:#5b4a35;border-radius:4px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:#4aa3df}

/* Map Grid & Item UI */
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 8px; }
.map-node { background: #fffdf5; border: 2px solid var(--edge); border-radius: 6px; padding: 10px 4px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .15s; }
.map-node:hover { background: #ffe9a8; border-color: var(--edge2); transform: translateY(-2px); }
.map-node.active { background: #ffe08a; border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
.map-node.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
.map-node.boss-node { border-color: #a23fd6; }
.item-icon-box { position: relative; width: 32px; height: 32px; border-radius: 4px; border: 2px solid var(--edge2); background: #2b1f14; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; cursor: pointer; }
.item-info { display: flex; align-items: center; gap: 8px; }
#tooltip { position: absolute; pointer-events: none; z-index: 100; display: none; width: 200px; padding: 8px; background: #1f1710f2; color: #fff; border: 2px solid var(--edge); border-radius: 6px; font-size: 12px; box-shadow: 0 4px 12px #0008; }
#tooltip .tt-title { font-weight: bold; border-bottom: 1px solid #ffffff33; padding-bottom: 3px; margin-bottom: 4px; }
#tooltip .tt-stat { color: #ffe08a; font-weight: bold; }

/* Login Modal Overlay */
#loginOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 999; display: flex; align-items: center; justify-content: center; }
.login-card { width: min(340px, 90vw); padding: 20px; background: var(--panel); border: 3px solid var(--edge); border-radius: 8px; box-shadow: 0 0 0 2px var(--edge2), 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
.login-card h2 { margin: 0 0 4px 0; font-size: 20px; color: var(--ink); }
.login-card p { font-size: 12px; margin-bottom: 16px; opacity: 0.8; }
.form-group { margin-bottom: 12px; text-align: left; }
.form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input { width: 100%; padding: 8px 10px; border: 1px solid var(--edge2); border-radius: 4px; background: #fffdf5; font: inherit; font-size: 13px; }
.login-btn { width: 100%; padding: 8px; font-weight: bold; font-size: 14px; margin-top: 6px; }
.login-err { color: #e5484d; font-size: 12px; margin-top: 8px; min-height: 16px; font-weight: bold; }
.login-footer { margin-top: 14px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>

<!-- Login Modal -->
<div id="loginOverlay">
  <div class="login-card">
    <h2>⚔️ Prontera Grind</h2>
    <p>Sign in to load your adventure progress</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Account Name</label>
        <input type="text" id="username" placeholder="Enter username..." required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password..." required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">Login / Register</button>
      <div id="loginErr" class="login-err"></div>
    </form>
    <div class="login-footer">
      <button type="button" onclick="playAsGuest()" style="flex:1;">Play as Guest</button>
    </div>
  </div>
</div>

<div id="wrap">
  <div class="title">
    <span id="stageTitle">Prontera Field</span>
    <span id="grindStatus" style="font-size:12px;opacity:0.85;"></span>
  </div>
  <div id="view">
    <div id="ov">
      <div id="prog"></div>
      <div id="tag"><b id="tn"></b><div class="bar"><i id="th" style="background:var(--hp)"></i></div></div>
      <div id="hint">Drag to rotate &middot; Scroll to zoom</div>
      <div id="feed"></div>
      <div id="dock"></div>
      <div id="wnd" class="win"><div class="title"><span id="wt"></span><button id="wx">&#10005;</button></div><div class="body" id="wb"></div></div>
    </div>
  </div>
  <div id="hud">
    <div><b id="cls2"></b> Lv <b id="lv">1</b></div>
    <div>HP <div class="bar"><i id="hpb" style="background:var(--hp)"></i></div></div>
    <div>SP <div class="bar"><i id="spb" style="background:#7a5ce0"></i></div></div>
    <div>EXP <div class="bar"><i id="xpb" style="background:var(--exp)"></i></div></div>
    <div style="color:var(--gold)">&#9679; <b id="zeny">0</b> Zeny</div>
    <div>Kills <b id="kills">0</b></div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <span id="userBadge" style="font-weight:bold; font-size:12px; background:#e9d39a; padding:3px 8px; border-radius:4px; border:1px solid var(--edge2);">👤 Guest</span>
      <button id="logoutBtn" onclick="logout()" style="display:none;">Logout</button>
      <button id="spd">Speed x1</button>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const RAR=[{n:'Common',m:1,w:60},{n:'Fine',m:1.4,w:25},{n:'Rare',m:2,w:10},{n:'Epic',m:3,w:4},{n:'Legendary',m:5,w:1}];
const SLOTS={
  weapon:{label:'Weapon',stat:'ATK',icons:['🔪','🗡️','⚔️','🗡️','🗡️'],names:['Knife','Sword','Katana','Claymore','Blade']},
  armor:{label:'Armor',stat:'DEF',icons:['👕','🧥','🛡️','🛡️','🛡️'],names:['Cotton Shirt','Leather Coat','Chain Mail','Plate Mail','Full Plate']},
  head:{label:'Headgear',stat:'HP',icons:['🎀','🎩','🪖','👑','👑'],names:['Ribbon','Hat','Helm','Circlet','Crown']}
};
const MOBS=[{n:'Poring',c:0xff9db8,shape:'blob'},{n:'Drops',c:0xffb45a,shape:'blob'},{n:'Fabre',c:0x9ed35a,shape:'worm'},{n:'Lunatic',c:0xf4f4f4,shape:'bunny'},{n:'Willow',c:0x6fa84a,shape:'tree'}];
const BOSSES=[{n:'Golden Bug',c:0xf2c230,shape:'bug'},{n:'Eddga',c:0xe67a2e,shape:'cat'},{n:'Mistress',c:0x5ad1c8,shape:'bug'},{n:'Baphomet',c:0x6a3fa0,shape:'demon'}];
const MOBS_PER_STAGE=5,BOSS_EVERY=5,BX_=7.5,Z0=-3,Z1=4;

const CLASSES={
  Novice:{aspd:1,atk:1,col:0xe8dcc0,cape:0,blade:[1,1],next:'Thief',lv:10},
  Thief:{aspd:.9,atk:1.1,col:0x4a7c3a,cape:0x2e7d32,blade:[.6,1],next:'Assassin',lv:25},
  Assassin:{aspd:.78,atk:1.25,col:0x2c2c3c,cape:0x1b1b28,blade:[.7,2.4],next:null}};
const STATS=[['str','STR','ATK'],['agi','AGI','ASPD, Flee'],['dex','DEX','Hit, min dmg'],['luk','LUK','Crit, drops'],['int','INT','SP, skill dmg']];
const SKILLS=[
  {id:'aid',n:'First Aid',cls:['Novice','Thief','Assassin'],max:5,sp:5,cd:6,d:L=>`Auto: heals ${10+5*L}% HP when below half.`},
  {id:'dbl',n:'Double Attack',cls:['Thief','Assassin'],max:5,passive:1,d:L=>`${10+8*L}% chance to strike twice.`},
  {id:'env',n:'Envenom',cls:['Thief','Assassin'],max:5,sp:8,cd:2.5,mul:L=>1.2+.3*L,hits:1,col:'#7dff7d',d:L=>`Auto: poison strike, ${Math.round((1.2+.3*L)*100)}% dmg.`},
  {id:'sonic',n:'Sonic Blow',cls:['Assassin'],max:5,sp:20,cd:4,mul:L=>.5+.1*L,hits:6,col:'#ff9dff',d:L=>`Auto: 6 slashes, ${Math.round((.5+.1*L)*100)}% each.`}];

let currentUser = null;
let S,speed=1,floats=[],drops=[],t=0,shake=0,atkAnim=0,hitAnim=0,pend=[],barT=0;
const pl={x:-3,z:1.5,ry:0,orb:0,run:0};
const skCd={aid:0,env:0,sonic:0};
const itemRegistry = new Map();

const fresh=()=>({cls:'Novice',lv:1,exp:0,hp:100,sp:30,zeny:0,kills:0,stage:1,best:1,killsInStage:0,pts:10,skp:0,sk:{aid:1},auto:true,q:null,
  st:{str:1,agi:1,dex:1,luk:1,int:1},eq:{weapon:null,armor:null,head:null},inv:[]});

/* Authentication & Account Save System */
function handleLogin(e){
  e.preventDefault();
  const u = $('username').value.trim();
  const p = $('password').value.trim();
  if(!u || !p) return;

  const accounts = JSON.parse(localStorage.getItem('pg_accounts') || '{}');
  if(accounts[u]){
    if(accounts[u].password !== p){
      $('loginErr').textContent = "Incorrect password.";
      return;
    }
  } else {
    accounts[u] = { password: p };
    localStorage.setItem('pg_accounts', JSON.stringify(accounts));
  }

  currentUser = u;
  localStorage.setItem('pg_session', currentUser);
  initSession();
}

function playAsGuest(){
  currentUser = 'Guest';
  localStorage.setItem('pg_session', 'Guest');
  initSession();
}

function logout(){
  save();
  localStorage.removeItem('pg_session');
  location.reload();
}

function load(){
  try{
    const saveKey = currentUser ? `pg_save_${currentUser}` : 'pg_save';
    const s = JSON.parse(localStorage.getItem(saveKey));
    if(s && s.lv){
      const f = Object.assign(fresh(), s);
      f.st = Object.assign(fresh().st, s.st || {});
      if(!s.st) f.pts = 10 + (s.lv - 1) * 3;
      if(!s.sk){ f.sk = {aid:1}; f.skp = Math.max(0, s.lv - 1); }
      return f;
    }
  } catch(e){}
  return fresh();
}

function save(){
  if(!currentUser) return;
  try{
    const saveKey = `pg_save_${currentUser}`;
    localStorage.setItem(saveKey, JSON.stringify(S));
  }catch(e){}
}

function initSession(){
  $('loginOverlay').style.display = 'none';$('userBadge').textContent = '👤 ' + currentUser;
  if(currentUser !== 'Guest') $('logoutBtn').style.display = 'inline-block';
  
  S = load();
  if(!S.q) S.q = ['kill','loot','stage'].map(newQuest);
  ui();
  log(`Welcome back, ${currentUser}!`);
}

// Auto-login session check
const savedSession = localStorage.getItem('pg_session');
if(savedSession){
  currentUser = savedSession;
  setTimeout(initSession, 10);
}

const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const isBoss=()=>S.stage%BOSS_EVERY===0,eqv=k=>S.eq[k]?ev(S.eq[k]):0,C=()=>CLASSES[S.cls],st=k=>S.st[k];
const maxHp=()=>80+S.lv*20+eqv('head')*4, maxSp=()=>20+S.lv*2+st('int')*3;
const atk=()=>Math.round((4+S.lv*2+eqv('weapon')+st('str')*1.5+st('dex')*.3+st('luk')*.2)*C().atk);
const aspd=()=>Math.max(.25,.85*C().aspd*(1-Math.min(.5,st('agi')*.006)));
const crit=()=>Math.min(60,3+st('luk')*.4),flee=()=>Math.min(60,st('agi')*.5+S.lv*.1),missCh=()=>Math.max(0,15-st('dex')*.25);
const def=()=>Math.floor(S.lv*.5+eqv('armor')),need=()=>Math.floor(20*Math.pow(S.lv,1.6)),cost=k=>1+Math.floor((S.st[k]-1)/10);
const skillOn=id=>lv(id)>0&&SKILLS.find(s=>s.id===id).cls.includes(S.cls);

let mob=null,pAtkT=0,mAtkT=0,respawn=0;
function spawn(){
  if(!S) return;
  const boss=isBoss()&&S.killsInStage>=MOBS_PER_STAGE,lvl=S.stage;
  if(boss){const b=BOSSES[(Math.floor(S.stage/BOSS_EVERY)-1)%BOSSES.length],hp=Math.floor(240*Math.pow(lvl,1.35));
    mob={...b,boss:true,hp,max:hp,atk:Math.floor(6+lvl*2.4),exp:60*lvl,zeny:ri(40,70)*lvl,size:1.9};
  }else{const m=MOBS[(S.stage-1+ri(0,2))%MOBS.length],hp=Math.floor(28*Math.pow(lvl,1.3));
    mob={...m,boss:false,hp,max:hp,atk:Math.floor(3+lvl*1.6),exp:Math.floor(11.7*lvl),zeny:ri(4,9)*lvl,size:1}}
  mob.x=pl.x>0?rnd(-BX_,-4):rnd(4,BX_);mob.z=rnd(Z0,Z1);mob.spawn=0;mob.ry=0;pAtkT=.3;mAtkT=.6;
}

function genItem(boss){
  const slot=['weapon','armor','head'][ri(0,2)];let roll=rnd(0,100)-(boss?25:0)-st('luk')*.15,tier=0,acc=0;
  for(let i=0;i<5;i++){acc+=RAR[i].w;if(roll<acc||i==4){tier=i;break}}
  if(boss&&tier<2)tier=2;
  const idx=Math.min(4,Math.floor((S.stage-1)/6)+ri(0,1)),base={weapon:3,armor:2,head:6}[slot]*(1+S.stage*.55);
  const icon=SLOTS[slot].icons[idx];
  return{id:Date.now()+Math.random(),slot,tier,icon,val:Math.max(1,Math.round(base*RAR[tier].m*rnd(.9,1.15))),name:(tier?RAR[tier].n+' ':'')+SLOTS[slot].names[idx]};
}
const addFloat=(x,y,z,txt,col,big)=>floats.push({x,y,z,txt,col,life:1,big});

function strike(mult,col){
  if(!mob)return;
  if(Math.random()*100<missCh()){addFloat(mob.x,1.8,mob.z,'Miss','#ccc');return}
  const c=Math.random()*100<crit(),d=Math.max(1,Math.round(atk()*mult*rnd(Math.min(.95,.7+st('dex')*.004),1.15)*(c?2+st('luk')*.01:1)));
  mob.hp-=d;mob.flash=1;shake=c?6:2;
  addFloat(mob.x+rnd(-.4,.4),1.5*Math.max(1,mob.size*.8)+.6,mob.z,c?d+'!':d,col||(c?'#ffe14d':'#fff'),c);
}

function playerAttack(){
  pAtkT=aspd();atkAnim=1;
  let sk=null;for(const id of['sonic','env']){const s=SKILLS.find(x=>x.id===id);if(skillOn(id)&&skCd[id]<=0&&S.sp>=s.sp){sk=s;break}}
  if(sk){S.sp-=sk.sp;skCd[sk.id]=sk.cd;addFloat(pl.x,3,pl.z,sk.n,sk.col);
    const m=sk.mul(lv(sk.id))*(1+st('int')*.01);strike(m,sk.col);for(let i=1;i<sk.hits;i++)pend.push({t:i*.09,m,col:sk.col})}
  else{strike(1);if(skillOn('dbl')&&Math.random()<.1+lv('dbl')*.08+st('dex')*.003){pend.push({t:.15,m:1,col:'#aef'});addFloat(pl.x,3,pl.z,'Double Attack','#aef')}}
}

function kill(){
  S.kills++;S.killsInStage++;S.q&&S.q.forEach(q=>{if(q.type==='kill')q.prog=Math.min(q.goal,q.prog+1)});S.zeny+=mob.zeny;S.exp+=mob.exp;pend=[];
  addFloat(mob.x,2.4,mob.z,'+'+mob.zeny+'z','#ffd23f');log(`${mob.n} defeated! +${mob.exp} EXP, +${mob.zeny} Zeny`);
  const n=mob.boss?ri(2,3):(Math.random()<.4+st('luk')*.003?1:0);
  for(let i=0;i<n;i++)drops.push({it:genItem(mob.boss),wx:mob.x+rnd(-.7,.7),wz:mob.z+rnd(-.7,.7),y:0,vy:-220,t:0});
  checkLevel();
  if(mob.boss||(!isBoss()&&S.killsInStage>=MOBS_PER_STAGE)){
    if(S.stage===S.best){
      S.best++;
      log(`Stage ${S.stage} cleared! Unlocked Stage ${S.best}.`,'r3');
    }
  }
  syncQ();mob=null;respawn=.7;save();ui();
}

function collect(it){S.inv.push(it);S.q&&S.q.forEach(q=>{if(q.type==='loot')q.prog=Math.min(q.goal,q.prog+1)});log(`Picked up [${RAR[it.tier].n}] ${it.name} (${SLOTS[it.slot].stat} +${it.val})`,'r'+it.tier);
  if(S.auto!==false){const cur=S.eq[it.slot];if(!cur||ev(it)>ev(cur))equip(it.id,true)}ui()}
function equip(id,quiet){const i=S.inv.findIndex(x=>x.id===id);if(i<0)return;const it=S.inv.splice(i,1)[0],old=S.eq[it.slot];
  if(old)S.inv.push(old);S.eq[it.slot]=it;S.hp=Math.min(S.hp,maxHp());if(!quiet)log('Equipped '+it.name);ui();save()}
function sell(id){const i=S.inv.findIndex(x=>x.id===id);if(i<0)return;const it=S.inv.splice(i,1)[0],z=Math.floor(it.val*(1+it.tier*2)*2);S.zeny+=z;log(`Sold ${it.name} for ${z}z`);ui();save()}

const lv=id=>S.sk[id]||0,ev=it=>Math.round(it.val*(1+(it.r||0)*.12)),iname=it=>(it.r?'+'+it.r+' ':'')+it.name;

function newQuest(type){const L=S?S.lv:1,g=type==='kill'?12+L*2:type==='loot'?3+Math.floor(L/3):(S?S.best:1)+2;

function showTooltip(e, itemId) {

  const tt = $('tooltip');
  tt.innerHTML = `
    <div class="tt-title r${it.tier}">${it.icon||'⚔️'} ${iname(it)}</div>
    <div>Rarity: <b class="r${it.tier}">${RAR[it.tier].n}</b></div>
    <div>Slot: ${SLOTS[it.slot].label}</div>

  tt.style.display = 'block';

}
function moveTooltip(e) {
  const tt = $('tooltip');
  tt.style.left = (e.clientX + 12) + 'px';
  tt.style.top = (e.clientY + 12) + 'px';
}
function hideTooltip() { $('tooltip').style.display = 'none'; }

function update(dt){
  if(!S) return;
  t+=dt;atkAnim=Math.max(0,atkAnim-dt*4);hitAnim=Math.max(0,hitAnim-dt*4);shake=Math.max(0,shake-dt*20);
  S.sp=Math.min(maxSp(),S.sp+dt*(1+st('int')/12));for(const k in skCd)skCd[k]=Math.max(0,skCd[k]-dt);
  if(skillOn('aid')&&S.hp<maxHp()*.5&&S.sp>=5&&skCd.aid<=0){S.sp-=5;skCd.aid=6;const h=Math.ceil(maxHp()*(.1+.05*lv('aid')));S.hp=Math.min(maxHp(),S.hp+h);addFloat(pl.x,2.6,pl.z,'+'+h,'#7dff7d')}
  for(let i=pend.length-1;i>=0;i--){const p=pend[i];p.t-=dt;if(p.t<=0){pend.splice(i,1);strike(p.m,p.col);if(mob&&mob.hp<=0){kill();break}}}
  let tx=0,tz=1.5,reach=1.4;
  if(!mob){respawn-=dt;if(respawn<=0)spawn()}
  else{
    mob.spawn=Math.min(1,mob.spawn+dt*3);mob.flash=Math.max(0,(mob.flash||0)-dt*6);
    reach=1.2+.45*mob.size;let dx=mob.x-pl.x,dz=mob.z-pl.z,dist=Math.hypot(dx,dz)||.01;
    mob.ry=Math.atan2(-dz,dx);
    if(dist>reach)mob.x-=dx/dist*dt*(mob.boss?1.2:1.6),mob.z-=dz/dist*dt*(mob.boss?1.2:1.6);
    mob.x=cl(mob.x,-BX_,BX_);mob.z=cl(mob.z,Z0,Z1);
    pl.orb+=dt*.8;tx=mob.x+Math.cos(pl.orb)*reach*.8;tz=mob.z+Math.sin(pl.orb)*reach*.8;
    dx=mob.x-pl.x;dz=mob.z-pl.z;dist=Math.hypot(dx,dz)||.01;
    if(dist<=reach+.6){
      pAtkT-=dt;mAtkT-=dt;
      if(pAtkT<=0){playerAttack();if(mob.hp<=0){kill();return}}
      if(mAtkT<=0){mAtkT=mob.boss?1.2:1.5;
        if(Math.random()*100<flee())addFloat(pl.x,2.4,pl.z,'Miss','#8cf');
        else{const d=Math.max(1,Math.round(mob.atk*rnd(.8,1.2)-def()*.6));S.hp-=d;hitAnim=1;addFloat(pl.x,2.4,pl.z,d,'#ff6b6b');
          if(S.hp<=0){log('You were defeated... resting and retrying stage.','r0');S.hp=maxHp();S.killsInStage=0;mob=null;respawn=1.5;pend=[];ui()}}}
    }
  }
  const px=tx-pl.x,pz=tz-pl.z,pd=Math.hypot(px,pz),spd=6.5+st('agi')*.05;pl.run=pd>.15;
  if(pd>.05){const s=Math.min(pd,spd*dt*(pd>3?1.4:1));pl.x+=px/pd*s;pl.z+=pz/pd*s}
  pl.x=cl(pl.x,-BX_,BX_);pl.z=cl(pl.z,Z0,Z1);
  if(mob)pl.ry=-Math.atan2(mob.z-pl.z,mob.x-pl.x);else if(pl.run)pl.ry=-Math.atan2(pz,px);
  if(S.hp<maxHp()&&Math.floor(t*2)!==Math.floor((t-dt)*2))S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*.008));
  barT-=dt;if(barT<=0){barT=.15;bars()}
  floats.forEach(f=>{f.life-=dt*1.1;f.y+=dt*.8});floats=floats.filter(f=>{if(f.life>0)return true;if(f.el)f.el.remove();return false});
  drops.forEach(d=>{d.t+=dt;d.vy+=700*dt;d.y+=d.vy*dt;if(d.y>0){d.y=0;d.vy=-d.vy*.4;if(Math.abs(d.vy)<40)d.vy=0}});
  for(let i=drops.length-1;i>=0;i--)if(drops[i].t>.9){collect(drops[i].it);drops.splice(i,1)}
}

mk(scene,BX(30,1,.6),0x9a9a9a,0,.5,-5.2);
for(let x=-14;x<=14;x+=4)mk(scene,BX(.8,1.6,.8),0x8a8a8a,x,.8,-5.2);
const fnt=new THREE.Group();mk(fnt,CY(1.1,1.3,.5),0xbbbbbb,0,.25,0);mk(fnt,CY(.15,.15,1.4),0xcccccc,0,1,0);mk(fnt,CY(.7,.5,.2),0x7ec8f0,0,.45,0);fnt.position.set(0,0,-3.6);scene.add(fnt);

const P=new THREE.Group();scene.add(P);
const pBody=mk(P,BX(.45,.9,.7),0x3b6fb5,0,1.1,0);
mk(P,BX(.47,.16,.72),0xc94a4a,0,.82,0);
const cape=mk(P,BX(.08,1.1,.62),0x2e7d32,-.3,1.15,0);
mk(P,BX(.3,.55,.25),0x4a3a2a,0,.3,-.18);mk(P,BX(.3,.55,.25),0x4a3a2a,0,.3,.18);
mk(P,SP(.42),0xffd9b0,0,1.95,0);
const hair=mk(P,new THREE.SphereGeometry(.46,16,10,0,Math.PI*2,0,Math.PI*.55),0xd0492c,0,2.0,0);
mk(P,SP(.06),0x111111,.36,1.98,-.16);mk(P,SP(.06),0x111111,.36,1.98,.16);
const arm=new THREE.Group();arm.position.set(.05,1.45,.5);P.add(arm);
mk(arm,BX(.18,.5,.18),0xffd9b0,0,-.1,0);
const blade=mk(arm,BX(.07,1.3,.14),0xaaaaaa,0,.95,0);mk(arm,BX(.1,.1,.4),0x7a4a1a,0,.28,0);

function buildMob(m){
  const G=new THREE.Group(),mats=[],c=m.c;
  const add=(geo,col,x,y,z,sx=1,sy=1,sz=1)=>{const o=mk(G,geo,col,x,y,z);o.scale.set(sx,sy,sz);if(col===c)mats.push(o.material);return o};
  const eyes=(x,y,col=0x111111)=>{add(SP(.09),col,x,y,.22);add(SP(.09),col,x,y,-.22)};
  switch(m.shape){
    case'blob':add(SP(),c,0,.6,0,1.4,1.1,1.4);eyes(-.68,.7);break;
    case'worm':for(let i=0;i<3;i++)add(SP(.42-.04*i),c,.5-i*.5,.42,0);eyes(-.55,.62);break;
    case'bunny':add(SP(),c,0,.6,0,1.1,1.1,1.1);add(CY(.12,.15,.9),c,-.05,1.55,.2);add(CY(.12,.15,.9),c,-.05,1.55,-.2);eyes(-.5,.75,0xd33333);break;
    case'tree':add(CY(.3,.4,1),0x6b4a2a,0,.5,0);add(SP(.85),c,0,1.55,0);eyes(-.75,1.55);break;
    case'bug':add(SP(),c,0,.5,0,1.5,.8,1);add(SP(.3),c,-.8,.6,0);
      for(const z of[-.4,.4])for(const x of[-.3,.3])add(CY(.05,.05,.7),0x333333,x,.2,z);eyes(-1.02,.7,0xcc0000);break;
    case'cat':add(SP(),c,0,.65,0,1.5,1,1);add(SP(.38),c,-.85,1,0);add(CN(.14,.4),c,-.85,1.45,.22);add(CN(.14,.4),c,-.85,1.45,-.22);
      add(CY(.08,.05,1),c,.9,.9,0,1,1,1).rotation.z=-.6;eyes(-1.18,1.05,0xffffff);break;
    default:add(SP(),c,0,.9,0,1,1.5,1);add(CN(.16,.7),0xeeeeee,-.3,1.95,.3);add(CN(.16,.7),0xeeeeee,-.3,1.95,-.3);eyes(-.5,1.2,0xffee44);
  }
  scene.add(G);return{G,mats};
}
let curMob=null,mobG=null,mobMats=[],lastBoss=null,dmesh=new Map(),tmp=new THREE.Vector3(),lastProg='';
function scr(x,y,z){tmp.set(x,y,z).project(cam);return[(tmp.x+1)/2*R.domElement.clientWidth,(1-tmp.y)/2*R.domElement.clientHeight]}

let drag=null;const dom=R.domElement;
dom.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];dom.setPointerCapture(e.pointerId)});
dom.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.006;el=Math.min(1.35,Math.max(.45,el+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});
dom.addEventListener('pointerup',()=>drag=null);dom.addEventListener('pointercancel',()=>drag=null);
dom.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2,Math.max(.6,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});

const ct=new THREE.Vector3(0,.8,0);
function draw(){
  if(!S) return;
  const bn=isBoss()&&S.killsInStage>=MOBS_PER_STAGE;
  if(bn!==lastBoss){lastBoss=bn;const col=new THREE.Color(bn?0x8a6bb0:0x9ad7f5);scene.background=col;scene.fog=new THREE.Fog(col,35,80)}
  const c=C();
  P.position.set(pl.x,Math.abs(Math.sin(t*(pl.run?16:4)))*(pl.run?.14:.04),pl.z);P.rotation.set(pl.run?.12:0,pl.ry,0);
  arm.rotation.z=pl.run&&!atkAnim?-.9+Math.sin(t*16)*.5:-.25-Math.sin(atkAnim*Math.PI)*1.9;
  hair.material.color.setHex(S.eq.head?TC[S.eq.head.tier]:0xd0492c);
  blade.material.color.setHex(S.eq.weapon?TC[S.eq.weapon.tier]:0xaaaaaa);blade.scale.set(1,c.blade[0],c.blade[1]);blade.position.y=.28+.65*c.blade[0];
  pBody.material.color.setHex(S.eq.armor?TC[S.eq.armor.tier]:c.col);pBody.material.emissive.setRGB(hitAnim*.8,0,0);
  cape.visible=!!c.cape;if(c.cape)cape.material.color.setHex(c.cape);
  if(mob!==curMob){if(mobG)scene.remove(mobG);curMob=mob;mobG=null;if(mob){const b=buildMob(mob);mobG=b.G;mobMats=b.mats}}
  if(mob&&mobG){const s=Math.max(.01,mob.size*mob.spawn);mobG.scale.set(s,s*(1+Math.sin(t*6)*.04),s);
    mobG.position.set(mob.x,0,mob.z);mobG.rotation.y=mob.ry;mobMats.forEach(m=>m.emissive.setScalar(mob.flash||0));
    const[px,py]=scr(mob.x,1.9*s+.5,mob.z);tag.style.display='block';tag.style.left=px+'px';tag.style.top=py+'px';
    $('tn').textContent=mob.n+(mob.boss?' (BOSS)':'');$('th').style.width=Math.max(0,mob.hp/mob.max*100)+'%';
  }else tag.style.display='none';
  const live=new Set();
  drops.forEach(d=>{live.add(d);let m=dmesh.get(d);
    if(!m){const sl=d.it.slot;m=mk(scene,sl==='weapon'?BX(.14,.75,.14):sl==='armor'?BX(.45,.45,.25):SP(.24),TC[d.it.tier]);
      m.material.emissive.setHex(TC[d.it.tier]).multiplyScalar(.45);dmesh.set(d,m)}
    m.position.set(d.wx,.35+Math.max(0,-d.y)/60,d.wz);m.rotation.y=t*3});
  dmesh.forEach((m,d)=>{if(!live.has(d)){scene.remove(m);dmesh.delete(d)}});
  ct.x+=(pl.x*.6-ct.x)*.05;ct.z+=(pl.z*.5-ct.z)*.05;
  const dd=(cam.aspect<1.5?21:14)/zoom,sk=shake*.03;
  cam.position.set(ct.x+Math.sin(az)*Math.cos(el)*dd+rnd(-sk,sk),Math.sin(el)*dd+.5,ct.z+Math.cos(az)*Math.cos(el)*dd+rnd(-sk,sk));
  cam.lookAt(ct);R.render(scene,cam);
  floats.forEach(f=>{if(!f.el){const e=document.createElement('div');e.className='fl'+(f.big?' big':'');e.textContent=f.txt;e.style.color=f.col;ov.appendChild(e);f.el=e}
    const[a,b]=scr(f.x,f.y,f.z);f.el.style.left=a+'px';f.el.style.top=b+'px';f.el.style.opacity=Math.max(0,f.life)});

  const done=Math.min(S.killsInStage,MOBS_PER_STAGE);
  let pt=bn?'BOSS FIGHT':`Monsters Defeated: ${done}/${MOBS_PER_STAGE}`;
  if(pt!==lastProg){lastProg=pt;prog.innerHTML=pt}
}

let last=performance.now();
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;
  for(let i=0;i<speed;i++)update(dt);draw();requestAnimationFrame(loop)}

resize();
respawn=0.3;
requestAnimationFrame(loop);
setInterval(save,5000);
</script>
