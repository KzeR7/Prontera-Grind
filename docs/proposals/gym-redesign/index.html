<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prontera Gymnasium - redesign proposal</title>
<style>
  :root{--ink:#3b2a1d;--parch:#efe3c8;--line:#8a6a45;--gold:#c9a227}
  html,body{margin:0;height:100%;overflow:hidden;background:#b9cbbb;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden}
  #stage canvas{position:absolute;inset:0;display:block}
  body.mobile{background:#8e9683;display:grid;place-items:center}
  body.mobile #stage{position:relative;inset:auto;height:min(844px,calc(100vh - 32px));
    width:calc(min(844px,calc(100vh - 32px)) * 0.4621);min-width:260px;border-radius:26px;
    box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 10px #2b2b2b,0 0 0 11px #4a4a4a}
  #hud{position:absolute;z-index:3;left:14px;top:14px;max-width:336px;padding:12px 14px;
       background:linear-gradient(#f6ecd6,#e8d9b6);border:1px solid var(--line);border-radius:3px;
       box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.35);
       font-size:12.5px;line-height:1.45}
  #hud h1{margin:0 0 2px;font-size:16px;letter-spacing:.02em}
  #hud .sub{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#7a5c3c;margin-bottom:8px}
  #hud dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font-size:11.5px}
  #hud dt{color:#7a5c3c}
  #hud dd{margin:0;font-variant-numeric:tabular-nums}
  #hud .views{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0;padding-top:9px;border-top:1px solid rgba(122,92,60,.35)}
  #hud button{font:inherit;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#4a3320;
       background:#f7eed8;border:1px solid rgba(122,92,60,.5);border-radius:2px;padding:3px 7px;cursor:pointer}
  #hud button:hover{background:#fff8e6}
  #hud button.on{background:#4a3320;color:#f7eed8;border-color:#4a3320}
  #hud .hint{margin-top:8px;font-size:10.5px;color:#6b5136}
  #labels{position:absolute;z-index:2;inset:0;pointer-events:none;overflow:hidden}
  .bay{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:10.5px;letter-spacing:.16em;
       text-transform:uppercase;color:#4a3320;background:rgba(247,238,216,.82);border:1px solid rgba(122,92,60,.55);
       border-radius:2px;padding:2px 7px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .bay.power{background:rgba(176,104,79,.92);color:#fff4ea;border-color:rgba(90,45,30,.6)}
  .bay.guard{background:rgba(95,125,149,.92);color:#f2f7fb;border-color:rgba(40,62,80,.6)}
  .bay.agility{background:rgba(201,154,78,.94);color:#3a2a12;border-color:rgba(120,85,25,.6)}
  .bay.focus{background:rgba(125,154,106,.94);color:#f4fbf0;border-color:rgba(55,80,45,.6)}
  body.mobile #hud{left:8px;top:8px;right:8px;max-width:none;padding:8px 9px}
  body.mobile #hud h1{font-size:13px}
  body.mobile #hud .sub{font-size:9.5px;margin-bottom:5px}
  body.mobile #hud dl{font-size:10px}
  body.mobile #hud .hint{display:none}
  body.mobile .views{display:none}
  @media (max-width:640px){#hud{left:8px;top:8px;right:8px;max-width:none;padding:9px 10px}#hud dl{font-size:10.5px}#hud .hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <h1>Prontera Gymnasium</h1>
    <div class="sub">Digimon Sanctuary &middot; redesign proposal</div>
    <dl>
      <dt>View</dt><dd id="v-view">&mdash;</dd>
      <dt>Triangles</dt><dd id="v-tri">&mdash;</dd>
      <dt>Draw calls</dt><dd id="v-calls">&mdash;</dd>
      <dt>Textures</dt><dd id="v-tex">&mdash;</dd>
    </dl>
    <div class="views" id="views">
      <button data-view="over">Overview</button>
      <button data-view="entry">Entry</button>
      <button data-view="power">Power</button>
      <button data-view="guard">Guard</button>
      <button data-view="agility">Agility</button>
      <button data-view="focus">Focus</button>
      <button data-view="top">Plan</button>
    </div>
    <div class="hint">Drag to orbit &middot; wheel to zoom &middot; keys <b>1&ndash;4</b> bays, <b>0</b> overview</div>
  </div>
  <div id="labels"></div>
</div>
<script src="../gym-asset-study/three.js"></script>
<script src="gym-redesign.js"></script>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    if (q.get('mobile') === '1') document.body.classList.add('mobile');
    var host = document.getElementById('views');
    host.addEventListener('click', function(e){
      var b = e.target.closest('button[data-view]');
      if (b && window.__gym) window.__gym.setView(b.dataset.view);
    });
    window.__syncViewButtons = function(name){
      [].forEach.call(host.querySelectorAll('button'), function(b){
        b.classList.toggle('on', b.dataset.view === name);
      });
    };
  })();
</script>
</body>
</html>
